api.details.api-aes-encrypt=raw(기본)는 AES-128/256(기본 256)과 최대 1 MiB 입력을 지원합니다.\nenc는 AES-256과 --key-id 필수, 결과 ENC 길이는 최대 16 KiB입니다.\nkey(기본)는 --key-file 또는 숨김 키 입력이 필요합니다.\npass는 --pass-file 또는 숨김 입력과 Hex Salt가 필요합니다.\nSalt는 raw 16~64바이트, enc 16바이트. 기본 PBKDF2-SHA256.\n반복 100000~5000000회. 기본 SHA256 600000, SHA512 210000.\nraw 전용으로 --aad 또는 --aad-file(64 KiB)과 --encoding(Base64).\n키·Passphrase 옵션은 배타적이며 Key ID는 enc 전용입니다.
api.example.api-aes-encrypt=sample.txt·aes.key와 보호된 UTF-8 sample.pass를 준비하세요. 암복호화에 같은 Salt·옵션·인코딩을 사용하세요.\njava -jar {jar} api aes enc --fmt raw --key-file aes.key --aad member-01 --in sample.txt --out aes.b64\njava -jar {jar} api aes enc --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.b64\njava -jar {jar} api aes enc --fmt enc --key-id app-key-01 --key-file aes.key --in sample.txt --out aes.enc\njava -jar {jar} api aes enc --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.enc
api.details.api-aes-decrypt=원래 형식(raw 기본)과 AES 크기(256 기본), 키를 사용하세요.\npass는 암호화 때와 같은 Salt·KDF·반복 횟수를 사용합니다.\nraw는 --input-encoding(Base64)과 --aad 또는 --aad-file을 지원.\nENC는 --format enc와 --key-id 필수. raw 전용 옵션은 배타적.\nENC 한도 16 KiB. raw의 인코딩 파일은 최대 2 MiB + 128바이트.\n원본 바이트는 --out, 터미널 UTF-8 표시는 --show를 사용하세요.
api.example.api-aes-decrypt=sample.txt·aes.key와 보호된 UTF-8 sample.pass를 준비하세요. 암복호화에 같은 Salt·옵션·인코딩을 사용하세요.\njava -jar {jar} api aes dec --fmt raw --key-file aes.key --aad member-01 --in aes.b64 --out restored-key.txt\njava -jar {jar} api aes dec --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in pass.b64 --out restored-pass.txt\njava -jar {jar} api aes dec --fmt enc --key-id app-key-01 --key-file aes.key --in aes.enc --out restored-enc.txt\njava -jar {jar} api aes dec --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in pass.enc --out restored-enc-pass.txt
api.details.api-rsa-encrypt=RSA --public-key가 필요합니다. OAEP/MGF1 SHA-256(기본)·SHA-512.\n최대 입력은 모듈러스 바이트 수에서 해시 길이의 두 배와 2를 뺀 값.\n더 큰 입력은 Hybrid를 사용하세요. 결과는 기본 Base64입니다.
api.example.api-rsa-encrypt=java -jar {jar} api rsa enc --pub-key rsa-public.pem --in sample.txt --out rsa.b64
api.details.api-rsa-decrypt=일치하는 RSA --private-key가 필요합니다. SHA-256 또는 SHA-512.\n기본 SHA-256·Base64. 디코딩한 암호문은 RSA 블록 한 개여야 합니다.\n인코딩 파일 한도 64 KiB. 평문에는 --out 또는 --show를 지정하세요.
api.example.api-rsa-decrypt=java -jar {jar} api rsa dec --priv-key rsa-private.pem --in rsa.b64 --out restored.txt
api.details.api-hybrid-encrypt=RSA --public-key 필수. RSA-OAEP-SHA256과 AES-256-GCM 봉투 사용.\n평문 최대 64 MiB. --aad 또는 --aad-file 최대 64 KiB.\n결과 기본 Base64. 복호화 시 일치하는 개인키를 사용하세요.
api.example.api-hybrid-encrypt=java -jar {jar} api hybrid enc --pub-key rsa-public.pem --in sample.txt --out hybrid.b64
api.details.api-hybrid-decrypt=RSA --private-key와 암호화 때의 --aad 또는 --aad-file을 사용합니다.\n기본 Base64. 인코딩 파일 한도 128 MiB + 64 KiB.\n바이너리는 --out, 확인 후 UTF-8 화면 표시는 --show로 출력합니다.
api.example.api-hybrid-decrypt=java -jar {jar} api hybrid dec --priv-key rsa-private.pem --in hybrid.b64 --out restored.txt
api.details.api-hmac-sign=Base64(기본) --key-file 또는 숨김 키 입력. 입력 데이터 최대 1 MiB.\nSHA-256(기본) 또는 SHA-512. MAC 결과는 기본 Hex.\n키는 32바이트 이상. --external-key 호환 키는 1바이트 이상.
api.example.api-hmac-sign=java -jar {jar} api hmac sign --key-file hmac.key --in request.json --out request.mac
api.details.api-hmac-verify=같은 키·입력(최대 1 MiB)·알고리즘·MAC 인코딩을 사용합니다.\n기본 SHA-256·Hex. 저장한 MAC은 --expected-file로 지정하세요.\n키는 32바이트 이상. --external-key 호환 키는 1바이트 이상.
api.example.api-hmac-verify=java -jar {jar} api hmac verify --key-file hmac.key --in request.json --expected-file request.mac
api.details.api-hash-generate=SHA-256(기본) 또는 SHA-512. 결과 기본 Hex. 파일은 스트리밍 처리.
api.example.api-hash-generate=java -jar {jar} api hash gen --in application.jar --out application.sha
api.details.api-hash-verify=같은 알고리즘(기본 SHA-256)과 인코딩(기본 Hex)을 사용하세요.\n--expected-file 또는 한 줄 입력으로 저장한 해시를 지정합니다.
api.example.api-hash-verify=java -jar {jar} api hash verify --in application.jar --expected-file application.sha
api.details.api-encode=기본 Base64. 최대 1 MiB. 입력 파일의 BOM과 줄바꿈도 보존합니다.
api.example.api-encode=java -jar {jar} api encode --enc base64 --in sample.bin --out sample.b64
api.details.api-decode=기본 Base64. 입력 최대 2 MiB + 5바이트. 바이너리는 --out으로 저장.
api.example.api-decode=java -jar {jar} api decode --enc base64 --in sample.b64 --out restored.bin
api.details.api-random-bytes=기본 32바이트, 범위 1~65536. 기본 표현 Base64.
api.example.api-random-bytes=java -jar {jar} api rand bytes --len 16 --enc hex --out salt.hex
api.details.api-random-token=기본 32바이트(16~1024), 표현 Base64URL.
api.example.api-random-token=java -jar {jar} api rand token --len 32 --out random.txt
api.details.api-random-string=길이는 기본 32, 범위 1~1024. 선택 Prefix는 최대 1024자.\n문자 집합은 digits, upper, lower, letters, upper-digits, lower-digits,\nalphanumeric(기본)입니다. --out 또는 승인한 --show로 출력.
api.example.api-random-string=java -jar {jar} api rand string --len 12 --alphabet digits --prefix TEST- --out random.txt
api.details.api-random-nonce=Base64URL 결과. 재사용 여부는 호출자가 관리합니다.
api.example.api-random-nonce=java -jar {jar} api rand nonce --out nonce.txt
api.details.api-random-uuid=표준 UUID 문자열을 반환합니다.
api.example.api-random-uuid=java -jar {jar} api rand uuid
api.details.api-password-hash=UTF-8 --password-file 또는 숨김 입력. 비밀번호 최대 1024바이트.\nPBKDF2 SHA-256 기본 600000회, SHA-512 기본 210000회.\n반복 100000~5000000회. --out 또는 승인한 --show로 결과 보호.
api.example.api-password-hash=java -jar {jar} api password hash --password-file app.pw --out app.hash
api.details.api-password-verify=저장 해시는 --in, 비밀번호는 --password-file 또는 숨김 입력으로 지정.\n알고리즘과 반복 횟수(1000~5000000)는 저장 해시에서 읽습니다.
api.example.api-password-verify=java -jar {jar} api password verify --password-file app.pw --in app.hash
api.details.api-password-needs-rehash=저장 해시는 --in으로 지정합니다. true/false를 출력합니다.\n정책은 PBKDF2 SHA-256(600000회) 또는 SHA-512(210000회),\n반복 횟수 허용 범위는 100000~5000000회입니다.
api.example.api-password-needs-rehash=java -jar {jar} api password needs-rehash --in app.hash
api.details.api-kdf-pbkdf2=숨김 입력 또는 --pass-file, Hex --salt 또는 --salt-file(16~64 B) 필요.\nPBKDF2 SHA-256(기본 600000회) 또는 SHA-512(기본 210000회).\n반복 100000~5000000회. 출력 16~64바이트(기본 32), 기본 Base64.
api.example.api-kdf-pbkdf2=java -jar {jar} api kdf pbkdf2 --pass-file sample.pass --salt-file salt.hex --out pbkdf2.key
api.details.api-kdf-hkdf=IKM은 --key-file 또는 숨김 입력. SHA-256(기본) 또는 SHA-512.\n선택 Salt와 Salt 파일은 Hex. --info는 UTF-8 문자열,\n--info-file은 원본 바이트를 읽습니다. 값과 파일 옵션은 배타적.\n길이 1~해시 길이의 255배(기본 32바이트). 결과 기본 Base64.
api.example.api-kdf-hkdf=java -jar {jar} api kdf hkdf --key-file hmac.key --info trial --out hkdf.key
api.details.api-signature-sign=PKCS#8 --private-key 필요. rsa-sha256(기본) 또는 ecdsa-sha256(P-256).\n서명 결과는 기본 Base64. 입력 파일은 스트리밍 처리.
api.example.api-signature-sign=java -jar {jar} api sig sign --priv-key rsa-private.pem --in sample.txt --out sample.sig
api.details.api-signature-verify=SPKI --public-key와 --signature-file(인코딩 파일 64 KiB 한도) 필요.\n서명과 같은 알고리즘(기본 RSA-SHA256), 인코딩(기본 Base64) 사용.\nECDSA-SHA256은 P-256과 DER 서명을 사용합니다.
api.example.api-signature-verify=java -jar {jar} api sig verify --pub-key rsa-public.pem --in sample.txt --sig-file sample.sig
api.details.api-certificate-info=PEM/DER 인증서 파일을 --in으로 지정합니다. 기본 UTC 현재 시각.\n--at은 ISO-8601. 인증서 정보와 날짜 유효 여부를 표시합니다.
api.example.api-certificate-info=java -jar {jar} api cert info --in server.crt
api.details.api-keygen=--type aes|hmac|rsa|ec|otp와 --reason(1~200자) 필수.\nAES 128/256비트(기본 256), HMAC SHA-256(기본) 또는 SHA-512.\nAES/HMAC 기본 Base64. OTP SHA1(기본)·SHA256·SHA512.\nOTP 출력은 Base32 고정. --encoding 생략 또는 base32만 지정.\nRSA 2048/3072/4096(기본 3072), EC P-256. --out에 접두어 지정.\nRSA/EC는 PEM 두 파일을 만듭니다. --encoding과 --show 사용 불가.
api.example.api-keygen=java -jar {jar} api keygen --type aes --bits 256 --out aes.key --reason 'AES example'\njava -jar {jar} api keygen --type hmac --out jwt.key --reason 'JWT HS256 example'\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api keygen --type ec --out ec --reason 'JWT ES256 example'\njava -jar {jar} api keygen --type otp --enc base32 --out otp.key --reason 'OTP enrollment example'
api.details.api-keyconvert=유형·출력 형식·입력·출력 필수. 입력은 PEM 또는 DER입니다.\nSPKI 공개키와 PKCS#8 개인키. 출력은 pem 또는 der.
api.example.api-keyconvert=java -jar {jar} api keyconv --type public --fmt der --in rsa-public.pem --out rsa.der
api.details.api-jwt-create=--algorithm hs256|rs256|es256 필수. 유효기간 기본 300초(최소 1초).\nHS256은 --key-file(32바이트 이상), RSA/EC는 --private-key\n(RSA 2048비트 이상 또는 P-256). 두 키 입력 유형은 배타적.\n선택 --claims-file(JSON, 64 KiB)·--kid·ISO-8601 시각.\n표준 클레임은 전용 옵션, Compact JWT 결과 최대 64 KiB.\n토큰은 --out 또는 승인한 --show로 받습니다.
api.example.api-jwt-create=claims.json과 expected.json을 준비하세요(예 {"department":"dev"}). 신뢰한 JWKS는 kid rsa-demo로 RSA 공개키를 포함해야 합니다.\njava -jar {jar} api jwt create --alg hs256 --key-file jwt.key --iss test-app --sub user01 --aud test-api --out jwt-hs.txt\njava -jar {jar} api jwt create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --kid rsa-demo --claims-file claims.json --out jwt-rs.txt\njava -jar {jar} api jwt create --alg es256 --priv-key ec-private.pem --iss test-app --sub user01 --aud test-api --out jwt-es.txt
api.details.api-jwt-inspect=Compact JWT(최대 64 KiB) --in 또는 숨김 토큰 입력.\n미검증 헤더·클레임은 --out 또는 승인한 --show로 출력합니다.\n출력은 미검증 안내와 헤더·페이로드 텍스트(.txt)입니다.
api.example.api-jwt-inspect=java -jar {jar} api jwt inspect --in jwt-hs.txt --out jwt-review.txt
api.details.api-jwt-verify=--algorithm hs256|rs256|es256, --audience 또는 --any-audience 필수.\nHS256은 --key-file(32 B 이상), RSA/EC는 --public-key 또는 --jwks-file.\n키 입력은 배타적입니다. JWKS JSON 한도 1 MiB.\n--in의 JWT는 최대 64 KiB. exp 필수, 허용 오차 0~300초(기본 0초).\n필수 이름은 --require-claims, 기대 문자열 값은 JSON 맵 사용.
api.example.api-jwt-verify=claims.json과 expected.json을 준비하세요(예 {"department":"dev"}). 신뢰한 JWKS는 kid rsa-demo로 RSA 공개키를 포함해야 합니다.\njava -jar {jar} api jwt verify --alg hs256 --key-file jwt.key --iss test-app --aud test-api --in jwt-hs.txt\njava -jar {jar} api jwt verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --require-claims department --require-claim-values-file expected.json --in jwt-rs.txt\njava -jar {jar} api jwt verify --alg es256 --pub-key ec-public.pem --iss test-app --aud test-api --in jwt-es.txt\njava -jar {jar} api jwt verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --in jwt-rs.txt
api.details.api-oauth-token=HTTPS --endpoint·--client-id·비밀 파일 또는 숨김 입력 필수.\nBasic 기본. --auth-method post는 서버 지원 시 선택합니다.\n연결 1~60초(5), 읽기 1~120초(10), 응답 1 KiB~1 MiB(64 KiB).\n--out 또는 --show. 발급 토큰이 16,384자(ASCII 16 KiB)를 넘으면\n저장 후 인트로스펙션 한도를 안내합니다.
api.example.api-oauth-token=java -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method basic --out remote-basic.txt\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method post --scope read --out remote-post.txt
api.details.api-oauth-introspect=Basic 전용. HTTPS --endpoint·--client-id·비밀값 입력 필수.\n--in 토큰 한도 16,384자(ASCII 16 KiB).\n연결 1~60초(5), 읽기 1~120초(10), 응답 1 KiB~1 MiB(64 KiB).\n--token-type-hint는 선택. 영문·숫자·밑줄 1~64자.\n--out 또는 --show 사용. active:false도 정상 서버 응답입니다.
api.example.api-oauth-introspect=java -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-basic.txt --out status-basic.json\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-post.txt --token-type-hint access_token --out status-post.json
api.details.api-oauth-create=로컬 RFC 9068 전용. --issuer·--subject·--audience·--client-id 필수.\n--algorithm hs256|rs256|es256과 --key-file 또는 --private-key 필요.\nHS256 32 B 이상, RSA 2048비트 이상, EC P-256.\n기본 300초. --scope·--roles 및 클레임 JSON(문자열·정수·불리언) 선택.\nCompact JWT는 최대 64 KiB이며 --out 또는 --show로 받습니다.
api.example.api-oauth-create=예시 HTTPS 주소와 클라이언트 값·정책을 실제 공급자 값으로 바꾸고 client.pw를 보호하세요. 로컬 JWKS는 kid rsa-demo의 공개키를 사용하고 설정형 프로파일에는 발급자 토큰과 JWKS를 준비합니다.\njava -jar {jar} api oauth create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --client-id test-app --kid rsa-demo --scope read --out access-local.txt
api.details.api-oauth-verify=로컬 검증입니다. --issuer·--audience·--algorithm 필수.\nHS256은 --key-file(32 B 이상), RSA/EC는 --public-key 또는 JWKS.\n--in JWT 한도 64 KiB. 허용 오차 0~300초(기본 0).\n기본 RFC 9068은 유형·클레임 이름 고정. --profile profile에는\n전용 --typ 또는 스코프 등 액세스 토큰 구분 조건이 필요합니다.
api.example.api-oauth-verify=예시 HTTPS 주소와 클라이언트 값·정책을 실제 공급자 값으로 바꾸고 client.pw를 보호하세요. 로컬 JWKS는 kid rsa-demo의 공개키를 사용하고 설정형 프로파일에는 발급자 토큰과 JWKS를 준비합니다.\njava -jar {jar} api oauth verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --profile profile --alg rs256 --jwks-file provider-jwks.json --iss https://auth.example.com --aud test-api --typ at+jwt --scope read --in provider-access.txt
api.details.api-otp-generate=Base32 --key-file(디코딩 후 16 B 이상) 또는 숨김 입력.\nTOTP 기본 SHA1과 30초(15~300). SHA256·SHA512도 허용.\nHOTP는 --counter와 SHA1 필수. --period·--at 배타적.\n--digits는 6~8(기본 6). 코드는 --out 또는 --show로 받습니다.
api.example.api-otp-generate=재현 시험에서는 생성과 검증에 같은 고정 UTC 시각을 사용하세요. 운영에서는 --at을 생략합니다.\njava -jar {jar} api otp gen --type totp --key-file otp.key --at 2026-11-26T00:00:00Z --out otp-code.txt
api.details.api-otp-verify=같은 Base32 --key-file·유형·자릿수·알고리즘·주기를 사용합니다.\n기본 TOTP/SHA1/6자리/30초. HOTP는 카운터와 SHA1 전용.\n허용 범위 기본 0. HOTP는 앞으로 0~100, TOTP는 양쪽 0~10단계.
api.example.api-otp-verify=재현 시험에서는 생성과 검증에 같은 고정 UTC 시각을 사용하세요. 운영에서는 --at을 생략합니다.\njava -jar {jar} api otp verify --type totp --key-file otp.key --at 2026-11-26T00:00:00Z --in otp-code.txt
api.details.api-otp-uri=TOTP 전용. Base32 --key-file·--issuer·--account 또는 대화형 입력.\nSHA1(기본)·SHA256·SHA512, 6~8자리(기본 6).\n주기 15~300초(기본 30). 비밀이 든 URI는 --out 또는 --show로 받습니다.
api.example.api-otp-uri=java -jar {jar} api otp uri --type totp --key-file otp.key --issuer TestApp --account user01 --out otp-uri.txt
api.details.api-request-auth-sign=HMAC SHA-256(기본) 또는 SHA-512. 공유키는 32 B 이상.\n요청 최대 1 MiB. --at은 Unix 초로 시계를 고정합니다.\nNonce는 자동 생성. JSON 세 필드를 --out으로 저장할 수 있습니다.
api.example.api-request-auth-sign=java -jar {jar} api req-auth sign --key-file hmac.key --in request.json --out request.sig.json
api.details.api-request-auth-verify=같은 키와 알고리즘(기본 SHA-256), 요청(최대 1 MiB)을 사용합니다.\n--auth-file 또는 --timestamp·--nonce·--mac 세 옵션을 사용하세요.\n--at은 Unix 초. 허용 오차 1~900초(기본 300), 재사용은 호출자가 관리.
api.example.api-request-auth-verify=java -jar {jar} api req-auth verify --key-file hmac.key --in request.json --auth-file request.sig.json
api.flow.aes=sample.txt와 보호된 UTF-8 sample.pass를 준비하세요. 아래 명령에서 키와 Salt를 생성합니다.\n\n1. Raw AES 키와 AAD\njava -jar {jar} api keygen --type aes --bits 256 --out aes.key --reason 'AES example'\njava -jar {jar} api aes enc --fmt raw --key-file aes.key --aad member-01 --in sample.txt --out aes.b64\njava -jar {jar} api aes dec --fmt raw --key-file aes.key --aad member-01 --in aes.b64 --out restored-key.txt\n\n2. Raw Passphrase와 Hex Salt\njava -jar {jar} api rand bytes --len 16 --enc hex --out salt.hex\njava -jar {jar} api aes enc --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.b64\njava -jar {jar} api aes dec --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in pass.b64 --out restored-pass.txt\n\n3. 키 ID를 포함한 ENC (키·Passphrase)\njava -jar {jar} api aes enc --fmt enc --key-id app-key-01 --key-file aes.key --in sample.txt --out aes.enc\njava -jar {jar} api aes dec --fmt enc --key-id app-key-01 --key-file aes.key --in aes.enc --out restored-enc.txt\njava -jar {jar} api aes enc --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.enc\njava -jar {jar} api aes dec --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in pass.enc --out restored-enc-pass.txt\n복원 파일을 원본 sample.txt와 비교하세요.
api.flow.rsa=java -jar {jar} api keygen --type rsa --out rsa --reason 'RSA interop'\njava -jar {jar} api rsa enc --pub-key rsa-public.pem --in sample.txt --out rsa.b64\njava -jar {jar} api rsa dec --priv-key rsa-private.pem --in rsa.b64 --out restored.txt
api.flow.hybrid=java -jar {jar} api keygen --type rsa --out rsa --reason 'Hybrid interop'\njava -jar {jar} api hybrid enc --pub-key rsa-public.pem --in sample.txt --out hybrid.b64\njava -jar {jar} api hybrid dec --priv-key rsa-private.pem --in hybrid.b64 --out restored.txt
api.flow.hmac=java -jar {jar} api keygen --type hmac --out hmac.key --reason 'HMAC interop'\njava -jar {jar} api hmac sign --key-file hmac.key --in request.json --out request.mac\njava -jar {jar} api hmac verify --key-file hmac.key --in request.json --expected-file request.mac
api.flow.signature=java -jar {jar} api keygen --type ec --out ec --reason 'signature test'\njava -jar {jar} api sig sign --alg ecdsa-sha256 --priv-key ec-private.pem --in sample.txt --out sample.sig\njava -jar {jar} api sig verify --alg ecdsa-sha256 --pub-key ec-public.pem --in sample.txt --sig-file sample.sig
api.flow.jwt=신뢰한 로컬 JWKS에 아래에서 생성한 rsa-public.pem 공개키를 kid rsa-demo로 등록합니다. claims.json과 expected.json의 예는 {"department":"dev"}입니다.\n\n1. HS256 공유 키, 분석·검증\njava -jar {jar} api keygen --type hmac --out jwt.key --reason 'JWT HS256 example'\njava -jar {jar} api jwt create --alg hs256 --key-file jwt.key --iss test-app --sub user01 --aud test-api --out jwt-hs.txt\njava -jar {jar} api jwt inspect --in jwt-hs.txt --out jwt-review.txt\njava -jar {jar} api jwt verify --alg hs256 --key-file jwt.key --iss test-app --aud test-api --in jwt-hs.txt\n\n2. RS256 업무 클레임과 로컬 JWKS\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api jwt create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --kid rsa-demo --claims-file claims.json --out jwt-rs.txt\njava -jar {jar} api jwt verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --require-claims department --require-claim-values-file expected.json --in jwt-rs.txt\njava -jar {jar} api jwt verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --in jwt-rs.txt\n\n3. ES256과 P-256 키쌍\njava -jar {jar} api keygen --type ec --out ec --reason 'JWT ES256 example'\njava -jar {jar} api jwt create --alg es256 --priv-key ec-private.pem --iss test-app --sub user01 --aud test-api --out jwt-es.txt\njava -jar {jar} api jwt verify --alg es256 --pub-key ec-public.pem --iss test-app --aud test-api --in jwt-es.txt\n검증에 성공하면 OK를 출력합니다.
api.flow.oauth=예시 주소를 바꾸고 허가된 클라이언트의 비밀을 보호된 client.pw에 저장하세요. 인트로스펙션은 Basic 지원이 필요합니다. 로컬 JWKS에는 생성한 RSA 공개키를 kid rsa-demo로 넣고 설정형 검증에는 공급자의 토큰과 신뢰 JWKS를 준비하세요.\n\n1. 원격 HTTPS 발급 및 인트로스펙션\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method basic --out remote-basic.txt\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method post --scope read --out remote-post.txt\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-basic.txt --out status-basic.json\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-post.txt --token-type-hint access_token --out status-post.json\n\n2. 로컬 RFC 9068 생성·검증\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api oauth create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --client-id test-app --kid rsa-demo --scope read --out access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\n\n3. 공급자의 토큰과 JWKS로 설정형 검증\njava -jar {jar} api oauth verify --profile profile --alg rs256 --jwks-file provider-jwks.json --iss https://auth.example.com --aud test-api --typ at+jwt --scope read --in provider-access.txt\n검증에 성공하면 OK를 출력합니다.
api.flow.otp=아래의 고정 UTC 시각은 재현 시험용입니다. 운영에서는 --at을 생략합니다.\njava -jar {jar} api keygen --type otp --out otp.key --reason 'OTP test'\njava -jar {jar} api otp uri --type totp --key-file otp.key --issuer TestApp --account user01 --out otp-uri.txt\njava -jar {jar} api otp gen --key-file otp.key --at 2026-11-26T00:00:00Z --out otp-code.txt\njava -jar {jar} api otp verify --key-file otp.key --at 2026-11-26T00:00:00Z --in otp-code.txt
api.flow.request-auth=java -jar {jar} api keygen --type hmac --out hmac.key --reason 'request test'\njava -jar {jar} api req-auth sign --key-file hmac.key --in request.json --out request.sig.json\njava -jar {jar} api req-auth verify --key-file hmac.key --in request.json --auth-file request.sig.json
api.option.require-claims=한 인자 안에 필수 클레임 이름을 공백으로 구분합니다.
api.option.require-claim-values-file=정확히 일치해야 하는 문자열 클레임의 보호 JSON 파일.
api.option.any-audience=특정 JWT 대상 값과의 일치 검사를 명시적으로 생략합니다.
api.option.auth-file=timestamp·nonce·mac을 담은 보호 RequestAuth JSON.
api.err.claimValues=기대 클레임 값이 모두 문자열인 JSON 객체를 사용하세요.
api.err.claimDuplicate=각 기대 클레임 값은 한 번만 지정하세요.
api.err.utf8={0}에 올바른 UTF-8을 사용하세요.
api.err.encoding={0}의 {1} 형식이 올바르지 않습니다. 지정한 인코딩을 확인하세요.
api.err.json={0}에 문서의 제한을 충족하는 올바른 JSON을 사용하세요.
api.err.read={0} 파일을 읽을 수 없습니다. 파일이 있고 읽기 권한이 있는지 확인하세요.
api.err.rsaKey=이 작업에는 {0}에 RSA 키를 지정하세요.
api.err.publicKey={0}에 SPKI 형식의 RSA 또는 EC 공개키(PEM/DER)를 지정하세요.
api.err.privateKey={0}에 PKCS#8 형식의 RSA 또는 EC 개인키(PEM/DER)를 지정하세요.
api.err.authFile=--auth-file에 timestamp·nonce·mac 문자열 3개만 지정하세요.
api.err.commandInput={0}의 입력이 올바르지 않습니다. --help에서 허용 옵션과 제한을 확인하세요.
api.err.jwksFormat=지원하는 RSA 또는 EC 공개키가 담긴 신뢰한 로컬 JWKS JSON을 사용하세요.
api.err.hs256Key=HS256은 --key-file에 32바이트 이상의 공유키가 필요합니다.
api.err.joseKey={0}의 키 유형 또는 크기가 {1}의 조건과 맞지 않습니다.
api.err.kid=--kid는 공백 없는 인쇄 가능 ASCII 1~256자여야 합니다.
api.err.jwtLimit=--in의 JWT가 64 KiB를 초과합니다. 더 작은 Compact JWT를 사용하세요.
api.err.introspectionLimit=--in이 OAuth 인트로스펙션 한도 16,384자(ASCII 16 KiB)를 초과합니다. 더 작은 토큰을 사용하세요. 64 KiB는 로컬 JWT 검증 한도입니다.
api.warn.introspectionLimit=토큰을 저장했습니다. api oauth introspect의 입력 한도 16,384자(ASCII 16 KiB)를 초과합니다. 조회에는 발급자의 더 작은 토큰을 사용하세요.
api.err.emptyToken=--in에 비어 있지 않은 액세스 토큰을 지정하세요.
api.err.tokenHint=--token-type-hint에 ASCII 영문·숫자·밑줄 1~64자를 사용하세요.
api.err.endpoint=--endpoint에 호스트가 있는 HTTPS URL을 지정하세요. 사용자 정보와 프래그먼트는 허용하지 않습니다.
api.err.clientCredentials=--client-id와 --client-secret-file에 비어 있지 않은 비밀값을 확인하세요.
api.err.scope=--scope에 올바른 OAuth 스코프를 공백으로 구분해 지정하세요.
api.err.oauthVerifier=--algorithm·--issuer·--audience와 일치하는 검증 키를 확인하세요.
api.err.oauthProfile=검증 키와 액세스 토큰 구분 조건을 확인하세요. 전용 --typ 또는 필수 스코프 등을 지정할 수 있습니다.
api.help.purpose.ENCRYPTION=암복호화
api.help.purpose.VERIFICATION=데이터 검증
api.help.purpose.UTILITIES=보안 유틸리티
api.help.purpose.KEYS=키·인증서
api.help.purpose.AUTHENTICATION=인증·인가
api.help.group.aes=직접 제공한 AES 키 또는 Passphrase로 암복호화합니다.
api.help.group.rsa=짧은 입력을 RSA 공개키로 보호합니다.
api.help.group.hybrid=공개키와 AES-GCM으로 큰 데이터를 보호합니다.
api.help.group.hmac=메시지 인증 코드를 생성하고 검증합니다.
api.help.group.hash=파일 또는 텍스트 해시를 계산하고 검증합니다.
api.help.group.signature=RSA 또는 ECDSA로 서명하고 검증합니다.
