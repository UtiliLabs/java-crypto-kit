# ---- keygen ----
cli.err.keygenOut=keygen에는 --out <키파일경로>가 필요합니다. 도움말: keygen --help
cli.err.keygenDir=키 파일을 만들 폴더가 없습니다. 상위 폴더를 먼저 만든 뒤 다시 실행하세요.
cli.err.keygenExists=키 파일이 이미 있습니다(FileAlreadyExistsException). 기존 키를 보호하기 위해 덮어쓰지 않습니다. 다른 파일 이름을 지정하세요.
cli.keygen.done=키 파일이 생성됐습니다. 키 지문: {0}
cli.keygen.next=다음: config embed-key --from-file {0} --key-id <새 키ID> --operator <ID>로 키 내장 JAR를 만들거나, 외부 키 파일(crypto.key.source=file)로 씁니다. {0}은(는) Git 저장소 밖의 보호된 곳에 백업하고, 외부 키 파일로 쓸 때는 WAS 실행 계정만 읽게 합니다.

# ---- encrypt / decrypt / verify ----
cli.encrypt.prompt=암호화할 값 (DB 비밀번호 또는 사용자명, 화면에 표시되지 않음):
cli.encrypt.next=다음: 위 한 줄 전체(ENC[...] 대괄호 포함)를 Tomcat Resource의 password="..."(또는 username)에 그대로 넣습니다. Tomcat에는 같은 JAR(키)를 배포합니다.
cli.decrypt.warn1=[주의] decrypt는 복호화한 평문을 화면에 표시합니다. 화면 공유·녹화·터미널 기록에 남을 수 있습니다.
cli.decrypt.warn2=       복호화 가능 여부만 확인하려면 verify를 사용하세요.
cli.decrypt.confirm=평문을 표시하려면 {0} 를 입력하세요 (그 외 입력은 취소):
cli.decrypt.cancel=취소했습니다. 평문을 표시하지 않았습니다.
cli.decrypt.prompt=복호화할 전체 암호문 ENC[...] 또는 B64[...]:
cli.decrypt.resultLabel=복호화 결과 (평문):
cli.decrypt.cleanup=[주의] 확인이 끝나면 터미널 화면과 스크롤 기록을 정리하세요.
cli.verify.prompt=복호화 검증용 암호문:
cli.verify.ok=검증 성공: 현재 키로 복호화할 수 있습니다. (평문 미출력)

