cfg.impact.line3=  - 기존 암호문은 rekey로 다시 암호화하고(또는 DB 비밀번호를 다시 encrypt) 운영 JNDI Resource의 password를 교체하세요.
cfg.impact.line4=  - WAS 재시작(또는 DataSource 재생성) 후 적용됩니다. 이전 암호문 자동 변환·자동 복호화 기능은 없습니다.
cfg.impact.line5=  - 내장 키는 JAR에서 추출할 수 있습니다. 사용자 지정 키 내장 JAR는 비밀 파일처럼 관리하세요.
