# java-crypto-kit CLI 메시지(한국어). UTF-8. 영어 기본 번들 cli.properties와 키가 정확히 같아야 한다(테스트가 검사).
# 자리표시자 {0},{1},... 에는 안전한 값(이름·개수·파일 이름)만 들어간다. 비밀값·사용자 입력값은 넣지 않는다.
# 출력 원칙: 정상 결과는 결과만(안내·권고 문구 없음), 오류는 원인 + 확인할 설정/조치. 운영·보안 참고는 사용자 가이드에 둔다.
# 조회 화면의 라벨은 콘솔 10칸(한글 2칸)으로 맞춘 뒤 ": "를 붙인다.

# ---- 인자·명령 분기 ----
