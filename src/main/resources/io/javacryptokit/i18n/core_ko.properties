# java-crypto-kit 라이브러리 메시지(한국어). UTF-8.
# 영어 기본 번들 core.properties와 키가 정확히 같아야 한다(테스트가 검사).
# 자리표시자 {0},{1},... 에는 안전한 값(설정 이름·개수·파일 이름)만 들어간다. 비밀값·사용자 입력값은 넣지 않는다.

# ---- 값의 출처(info) ----
origin.NONE=없음(JAR 내장 기본값만 사용)
origin.EXPLICIT_PATH=직접 지정(CLI --config 또는 CredentialCrypto.fromConfigFile)
origin.JVM_PROPERTY=JVM 속성 -D{0}
origin.ENVIRONMENT=환경변수 {0}
value.JAR_DEFAULT=JAR 기본값
value.EXTERNAL_FILE=외부 설정 파일
value.JVM_PROPERTY=JVM 속성 -D

# ---- 설정 로딩·검증 ----
config.err.pathBlank={0} 값이 비어 있습니다. 외부 설정 파일 경로를 지정하거나, 외부 설정을 쓰지 않으려면 이 설정 자체를 지우세요.
config.err.embeddedJvm={0}는 JVM 속성(-D)으로 지정할 수 없습니다. 키 원문을 명령행에 두지 말고 키 파일(crypto.key.source=file) 또는 환경변수(crypto.key.source=env)로 공급하세요.
config.err.control={0}의 값에 줄바꿈·제어문자를 쓸 수 없습니다.
config.err.choice={0}의 값이 허용값이 아닙니다(허용값: {1}).
config.err.choice.crypto.algorithm=지원하지 않는 암호화 알고리즘입니다. AES/GCM/NoPadding만 허용됩니다.
config.err.choice.crypto.key.source=키 공급 방식은 embedded, file, env, vault, aws-kms 중 하나여야 합니다.
config.err.choice.crypto.output.encoding=crypto.output.encoding은 enc 또는 base64만 허용됩니다.
config.err.choice.crypto.pool.factory=승인되지 않은 JDBC Pool Factory입니다.
config.err.choice.crypto.require.encrypted.password=DB 비밀번호 암호문 필수 정책은 해제할 수 없습니다.
config.err.choice.crypto.lang=crypto.lang은 ko(기본), en, auto만 허용됩니다.
config.err.boolean={0}는 true 또는 false만 허용됩니다.
config.err.number={0}는 {1}~{2} 사이의 정수여야 합니다.
config.err.keyId=키 식별자 형식이 올바르지 않습니다.
config.err.format.crypto.vault.url=crypto.vault.url은 https://호스트[:포트] 형식이어야 합니다(경로·쿼리·사용자 정보 불가, http 불가).
config.err.format.crypto.vault.mount=crypto.vault.mount 형식이 올바르지 않습니다(영문·숫자·_·- 를 / 로 구분, 예: secret).
config.err.format.crypto.vault.path=crypto.vault.path 형식이 올바르지 않습니다(영문·숫자·_·-·. 를 / 로 구분, . 또는 .. 구간 불가, 예: java-crypto-kit/prod).
config.err.format.crypto.vault.field=crypto.vault.field 형식이 올바르지 않습니다(영문·숫자·_·-·., 1~128자).
config.err.format.crypto.vault.ver=crypto.vault.ver는 비워 두거나(최신 버전) 1 이상의 정수여야 합니다.
config.err.format.crypto.vault.token.env=crypto.vault.token.env의 환경변수 이름 형식이 올바르지 않습니다(영문·밑줄로 시작, 영문·숫자·밑줄만 사용).
config.err.format.crypto.aws.region=crypto.aws.region 형식이 올바르지 않습니다(예: ap-northeast-2). 비워 두면 AWS SDK 기본 리전 설정(AWS_REGION 등)을 씁니다.
config.err.format.crypto.aws.kms.key.id=crypto.aws.kms.key.id 형식이 올바르지 않습니다(키 ID, 키 ARN, alias/이름, 별칭 ARN).
config.err.awsArnRegion=crypto.aws.kms.key.id ARN의 리전과 crypto.aws.region이 다릅니다. 같은 리전으로 맞추세요.
config.err.vaultToken=crypto.key.source=vault에는 Vault 토큰 공급 방법이 필요합니다. crypto.vault.token.env(환경변수 이름) 또는 crypto.vault.token.file(토큰 파일 경로)을 지정하세요.
config.err.required=crypto.key.source={0}에는 {1}가 필요합니다.
config.err.ambiguousSource=외부 설정 또는 JVM 속성에 키 공급원 설정(키 파일 경로·키 환경변수 이름·Vault·AWS KMS)이 있지만 crypto.key.source가 없습니다. crypto.key.source=file, env, vault, aws-kms 중 하나를 명시하세요(내장 키를 쓰려면 embedded).
config.more=\ 외 {0}개
config.err.unknownExternalUnsafe=외부 설정 파일에 지원하지 않는 항목이 있습니다{0}(이름 표시 생략: 허용되지 않는 문자 포함). '이름=값' 형식과 항목 이름을 확인하세요.
config.err.unknownExternal=외부 설정 파일에 지원하지 않는 항목 '{0}'{1}이(가) 있습니다. {2}
config.hint.didYouMean='{0}'을(를) 의도했는지 확인하세요.
config.hint.seeHelp=전체 설정 이름은 CLI 명령 config help로 확인하세요.
config.err.jvmTypoUnsafe=이 라이브러리 설정으로 보이는 JVM 속성 이름이 올바르지 않습니다{0}(이름 표시 생략: 허용되지 않는 문자 포함). -Dcrypto.* 옵션의 이름을 확인하세요.
config.err.jvmTypo=JVM 속성 '{0}'{1}은(는) 지원하지 않는 설정 이름입니다. {2} 오타를 무시하면 의도와 다른 키·정책으로 동작할 수 있어 중단합니다.
config.err.configFileInFile={0}는 설정 파일 안에 쓰는 항목이 아닙니다. 외부 설정 파일 경로는 파일 밖에서 -D{0}=<경로> 또는 환경변수 {1}로 지정하세요.

# ---- 오류 형식(CredentialCryptoException, CLI, Tomcat Factory) ----
format.reason=[사유: {0}]
exception.causeType=\ (원인 유형: {0})
exception.action=\ 조치: {0}
reason.CONFIGURATION=설정 파일을 읽지 못했거나 설정값이 올바르지 않습니다.
reason.KEY_SOURCE=암호화 키를 읽지 못했거나 키 형식이 올바르지 않습니다.
reason.INVALID_INPUT=입력값이 올바르지 않습니다.
reason.INVALID_TOKEN=암호문 형식이 올바르지 않습니다.
reason.KEY_ID_MISMATCH=암호문의 키 식별자와 현재 설정의 키 식별자가 다릅니다.
reason.INTEGRITY=암호문 무결성 검증에 실패했습니다(다른 키이거나 암호문이 변조·손상됨).
reason.CRYPTO_PROVIDER=Java 암호화 기능(AES-256-GCM)을 사용할 수 없습니다.
action.CONFIGURATION=설정 파일 경로·UTF-8 저장·항목 이름과 허용값을 확인하고, 같은 옵션으로 CLI info 또는 doctor를 실행해 점검하세요.
action.KEY_SOURCE=crypto.key.source에 맞는 키 공급원(키 파일 crypto.key.file, 환경변수 crypto.key.env, Vault, AWS KMS)을 이 프로세스가 읽을 수 있는지, 키가 keygen 형식(Base64 44자)인지 CLI doctor로 점검하세요.
action.INVALID_INPUT=빈 값이나 너무 긴 값(평문 약 12KB 초과)이 아닌지, 파일이면 경로·권한·디스크 공간을 확인하세요.
action.INVALID_TOKEN=CLI가 출력한 암호문 한 줄 전체(ENC 또는 B64로 시작해 닫는 대괄호까지)를 앞뒤 공백 없이 넣었는지, 파일이면 file encrypt로 만든 파일인지 확인하세요.
action.KEY_ID_MISMATCH=암호화할 때와 같은 crypto.key.id와 키 공급원을 쓰는지 CLI info로 확인하세요. 키를 바꿨다면 rekey로 다시 암호화하세요.
action.INTEGRITY=암호화할 때와 같은 키인지(CLI fingerprint로 비교), 암호문·파일이 잘리거나 바뀌지 않았는지 확인하세요.
action.CRYPTO_PROVIDER=AES-256-GCM을 지원하는 Java(최신 업데이트)를 사용하세요.

# ---- 토큰·문자열 암호 엔진 ----
token.err.null=값이 없습니다.
token.err.prefix=ENC[...] 또는 B64[...] 형식이 아닙니다.
token.err.b64Length=B64 포장의 길이 또는 괄호가 올바르지 않습니다.
token.err.b64Chars=B64 포장이 패딩 없는 Base64URL이 아닙니다.
token.err.b64Decode=B64 포장을 디코딩할 수 없습니다.
token.err.b64Canonical=B64 포장이 정규 Base64URL 표기가 아닙니다.
token.err.b64Utf8=B64 포장 안의 값이 올바른 UTF-8이 아닙니다.
token.err.b64Inner=B64 포장 안에 ENC[v1:...] 암호문이 없습니다(중첩 포장 금지).
cipher.err.notEncodable=UTF-8로 표현할 수 없는 문자가 있습니다.
cipher.err.tooLong=암호화할 값이 너무 깁니다(암호문 최대 16,384자, 평문 약 12KB).
cipher.err.length=IV 또는 암호문의 길이가 올바르지 않습니다.
cipher.err.notUtf8=복호화 결과가 UTF-8 텍스트가 아닙니다. 바이너리 데이터는 decryptBytes를 사용하세요.
cipher.err.format=ENC[v1:...] 형식이 아니거나 길이가 허용 범위를 넘습니다.
cipher.err.version=지원하지 않는 암호문 버전 또는 키 식별자 형식입니다.
cipher.err.base64=암호문의 Base64URL 인코딩이 올바르지 않습니다.
service.err.empty=값이 비어 있습니다.
service.err.configRead=외부 설정 파일의 경로·존재 여부·UTF-8 저장 여부·형식을 확인하세요.
service.err.keyRead=키 파일·키 공급원의 경로·존재 여부·읽기 권한·연결을 확인하세요.
api.err.configPath=설정 파일 경로가 없습니다.
api.err.filePath=입력 또는 출력 파일 경로가 없습니다.

