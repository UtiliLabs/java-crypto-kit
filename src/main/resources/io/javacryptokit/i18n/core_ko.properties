key.err.base64=키는 표준 Base64 형식이어야 합니다. keygen으로 만든 값(44자 한 줄)인지 확인하세요.
key.err.length=AES-256 키는 정확히 32바이트여야 합니다. keygen으로 만든 표준 Base64 키(44자)인지 확인하세요.
