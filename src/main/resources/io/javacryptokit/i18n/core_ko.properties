# ---- Vault KV v2 ----
key.vault.latest=최신
key.vault.tokenFromEnv=환경변수 {0}
key.vault.tokenFromFile=파일 {0}
key.action.vaultSettings=crypto.vault.url, crypto.vault.mount, crypto.vault.path, crypto.vault.field를 지정하세요(help vault 참고).
key.vault.err.tokenEnvMissing=Vault 토큰 환경변수 {0}가 없거나 비어 있습니다. WAS 서비스 프로세스(또는 CLI를 실행한 셸)에 토큰이 전달됐는지 확인하세요.
key.vault.err.tokenFormat=Vault 토큰 형식이 올바르지 않습니다({0}). 공백·줄바꿈 없는 한 줄이어야 합니다.
key.vault.err.ca=Vault CA 인증서 파일(crypto.vault.ca.file)을 읽지 못했습니다. PEM X.509 형식인지 확인하세요.
key.vault.err.tls=Vault 서버의 TLS 인증서를 신뢰할 수 없거나 서버 이름이 인증서와 다릅니다. 인증서 검증은 끌 수 없습니다. crypto.vault.url의 호스트 이름과 crypto.vault.ca.file(사설 CA)을 확인하세요.
key.vault.err.timeout=Vault 응답이 제한 시간(crypto.vault.timeout.ms)을 넘었습니다({0}회 시도).
key.vault.err.network=Vault 서버에 연결하지 못했습니다({0}회 시도, 주소·포트·방화벽·DNS 확인).
key.vault.err.auth=Vault가 인증을 거부했습니다(토큰이 없거나 만료·폐기됨). 새 토큰을 발급해 토큰 파일 또는 환경변수에 넣으세요.
key.vault.err.permission=Vault 토큰은 유효하지만 이 Secret을 읽을 권한이 없습니다. 정책에 <마운트>/data/<경로> read 권한을 부여하세요. Vault는 정책 밖의 경로를 "없음"이 아니라 "권한 없음"으로 답하므로 crypto.vault.mount·crypto.vault.path가 맞는지도 확인하세요.
key.vault.err.notFound=Vault에서 Secret 또는 지정한 버전을 찾지 못했습니다(crypto.vault.mount·crypto.vault.path·crypto.vault.ver와 KV v2 마운트인지 확인).
key.vault.err.deleted=Vault Secret의 해당 버전이 삭제(또는 파기)되었습니다. 다른 버전을 지정하거나 Secret을 복원하세요.
key.vault.err.field=Vault Secret에 필드 {0}가 없거나 문자열이 아닙니다(crypto.vault.field 확인).
key.vault.err.redirect=Vault가 다른 주소로 리다이렉트했습니다. 토큰 보호를 위해 따르지 않습니다. 활성 노드나 로드밸런서 주소를 crypto.vault.url에 지정하세요.
key.vault.err.unavailable=Vault가 일시적으로 요청을 처리하지 못했습니다(HTTP {0}, 봉인·대기 노드·과부하 가능). 원인을 해결한 뒤 WAS를 다시 시작하세요.
key.vault.err.status=Vault가 예상하지 못한 응답을 돌려주었습니다(HTTP {0}).
key.vault.err.response=Vault 응답 형식이 올바르지 않습니다(KV v2 응답이 아님).
key.check.vaultTokenEnv=Vault 토큰 환경변수 {0}가 있습니다(값 비공개).
key.check.vaultDefaultTrust=Vault 서버 인증서를 JVM 기본 신뢰 저장소로 검증합니다(crypto.vault.ca.file 미지정).
key.check.vaultLatest=crypto.vault.ver를 지정하지 않아 Secret의 최신 버전을 읽습니다. 새 버전이 쓰이면 다음 재시작부터 다른 키가 적용되어 기존 암호문이 복호화되지 않을 수 있습니다.
key.action.vaultPinVersion=crypto.vault.ver로 버전을 고정하세요.

# ---- AWS KMS ----
key.aws.regionDefault=AWS SDK 기본값
key.check.awsSdk=AWS SDK 2.x(KMS, URLConnection HTTP 클라이언트)가 설치되어 있습니다.
key.aws.err.sdkMissing=aws-kms에 필요한 AWS SDK for Java 2.x가 설치되어 있지 않습니다. 기본 사용(embedded/file/env/vault)에는 필요하지 않습니다.
key.action.awsSdk=java-crypto-kit-aws-kms-lib-<버전>.zip의 JAR들을 java-crypto-kit JAR 옆에 두세요(Tomcat: CATALINA_BASE/lib, CLI: java -cp). help aws-kms 참고.
key.action.awsSettings=crypto.aws.kms.key.id와 crypto.aws.kms.data-key.file을 지정하세요(데이터 키 파일은 kms datakey로 만듭니다).
key.check.awsDataKeyFormat=데이터 키 파일 형식이 올바릅니다(암호화된 데이터 키, 그 자체로는 비밀 아님).
key.aws.err.dataKeyFormat=데이터 키 파일(crypto.aws.kms.data-key.file)이 kms datakey로 만든 Base64 암호화 데이터 키가 아닙니다.
key.action.awsDataKey=kms datakey로 데이터 키 파일을 다시 만들거나 올바른 파일을 지정하세요.
key.check.awsRegionDefault=crypto.aws.region을 지정하지 않아 AWS SDK 기본 리전 체계(AWS_REGION, 프로필, EC2 메타데이터)를 씁니다.
key.check.awsRegion=AWS 리전: {0}
key.check.awsEndpoint=KMS 엔드포인트를 {0}로 바꿨습니다(SDK 표준 설정).
key.check.awsEndpointHttp={0}로 지정한 KMS 엔드포인트가 HTTPS가 아닙니다.
key.action.awsEndpoint=운영에서는 HTTPS 엔드포인트를 쓰세요(http는 로컬 에뮬레이터 시험용).
key.check.awsJvmCredential=AWS 자격증명 JVM 속성 -D{0}가 지정되어 있습니다(프로세스 목록·기동 로그에 노출).
key.action.awsJvmCredential=AWS 자격증명을 -D로 넘기지 말고 IAM 역할·프로필·환경변수를 쓰세요.
key.aws.err.timeout=AWS KMS 요청이 제한 시간(crypto.aws.kms.timeout.ms, 재시도 포함)을 넘었습니다.
key.aws.err.client=AWS SDK 요청에 실패했습니다({0}).
key.aws.err.accessDenied=AWS KMS가 접근을 거부했습니다(AccessDeniedException). IAM 정책과 키 정책의 kms:Decrypt(kms datakey는 GenerateDataKey·Encrypt) 권한을 확인하세요.
key.aws.err.incorrectKey=데이터 키가 crypto.aws.kms.key.id와 다른 KMS 키로 암호화되어 있습니다(IncorrectKeyException).
key.aws.err.invalidCiphertext=AWS KMS가 데이터 키를 복원하지 못했습니다(InvalidCiphertextException). 데이터 키 파일이 손상되었거나, 데이터 키를 만들 때와 crypto.key.id(Encryption Context)가 다릅니다.
key.aws.err.notFound=KMS 키를 찾지 못했습니다(NotFoundException). crypto.aws.kms.key.id와 리전·계정을 확인하세요.
key.aws.err.disabled=KMS 키가 비활성화되었거나 사용할 수 없는 상태입니다(DisabledException / KMSInvalidStateException).
key.aws.err.keyUsage=암호화에 쓸 수 없는 KMS 키입니다(InvalidKeyUsageException). 대칭 ENCRYPT_DECRYPT 키를 쓰세요.
key.aws.err.auth=AWS가 자격증명을 거부했습니다(잘못됨·만료·서명 불일치). IAM 역할·프로필·환경변수 자격증명을 확인하세요.
key.aws.err.unavailable=AWS KMS를 일시적으로 쓸 수 없습니다({0}). 원인을 해결한 뒤 WAS를 다시 시작하세요.
key.aws.err.service=AWS KMS가 오류를 돌려주었습니다({0}).
key.aws.err.credentials=AWS SDK 표준 자격증명 체계(환경변수, 웹 ID, 프로필, 컨테이너, EC2 인스턴스 프로필)에서 자격증명을 찾지 못했습니다.
key.aws.err.region=AWS 리전을 찾지 못했습니다. crypto.aws.region 또는 AWS_REGION을 지정하세요.
key.aws.err.tls=AWS 엔드포인트의 TLS 인증서를 신뢰할 수 없습니다(프록시·JVM 신뢰 저장소 확인).
key.aws.err.network=AWS KMS에 연결하지 못했습니다(네트워크·프록시·DNS·VPC 엔드포인트 확인).

# ---- 파일 암복호화(JCKF v1) ----
file.err.inMissing=입력 파일({0})이 없습니다.
file.err.inNotRegular=입력({0})이 일반 파일이 아닙니다(폴더·장치 파일·FIFO 불가).
file.err.inUnreadable=이 계정으로 입력 파일({0})을 읽을 수 없습니다.
file.err.samePath=입력과 출력이 같은 경로입니다. 다른 출력 파일을 지정하세요.
file.err.outExists=출력 파일({0})이 이미 있습니다. 덮어쓰지 않으니 다른 이름을 지정하거나 기존 파일을 옮기세요.
file.err.outDir=출력 파일({0})을 만들 폴더가 없습니다.
file.err.read=파일({0})을 읽지 못했습니다.
file.err.io=파일을 처리하지 못했습니다({0} -> {1}). 권한과 디스크 공간을 확인하세요. 원본은 바뀌지 않았고 출력은 남기지 않았습니다.
file.err.tempLeft=임시 파일({0})을 지우지 못했습니다. 출력 폴더에서 직접 지우세요(검증 전 데이터가 있을 수 있음).
file.err.tooLarge=JCKF v1로 처리하기에 파일이 너무 큽니다(최대 약 256TiB).
file.err.version=지원하지 않는 암호화 파일 버전입니다.
file.err.integrity=암호화 파일 인증에 실패했습니다(다른 키이거나 파일이 변조·손상됨).
file.err.notFormat=java-crypto-kit가 만든 암호화 파일(JCKF v1)이 아닙니다.
file.err.truncated=암호화 파일이 잘렸거나 손상되었거나 뒤에 다른 데이터가 붙어 있습니다.

# ---- Tomcat JDBC Factory ----
factory.err.unsupportedRef=지원하지 않는 JNDI Resource 형식입니다. 조치: Resource의 type을 javax.sql.DataSource로 지정하세요.
factory.err.notDataSource=javax.sql.DataSource 리소스만 지원합니다. 조치: Resource의 type을 javax.sql.DataSource로 지정하세요.
factory.err.config=암복호화 설정을 불러오거나 검증하지 못했습니다. {0}
factory.err.notString=DB 접속정보가 문자열 형태가 아닙니다. 조치: Resource의 username·password 속성 값을 확인하세요.
factory.err.plaintext=DB 비밀번호에는 ENC[v1:...] 또는 B64[...] 암호문이 필요합니다. 조치: CLI encrypt로 만든 값 전체를 Resource의 password에 넣으세요.
factory.err.decrypt=DB 접속정보({0}) 복호화에 실패했습니다. {1}
factory.err.missingPassword=DB 비밀번호 속성이 누락되었습니다. 조치: Resource에 password(암호문)를 추가하세요.
factory.err.pool=Connection Pool({0}) 생성에 실패했습니다(원인 유형: {1}). 조치: Pool 라이브러리({2})와 JDBC 드라이버가 CATALINA_BASE/lib에 있는지, DB 접속 정보를 확인하세요(SQLState 28000은 DB가 로그인을 거부한 경우).
factory.err.noDataSource=공식 Pool Factory가 DataSource를 반환하지 않았습니다. 조치: Resource의 Pool 속성을 확인하세요.
factory.log.delegated=Tomcat 기본 JDBC Pool에 안전하게 위임했습니다.
