key.describe.embeddedExternal=외부 설정 파일({0}) - Properties 파일 안의 키입니다. 키 파일(crypto.key.source=file)이나 config embed-key를 권장합니다
key.describe.fileNone=파일(경로 미지정)
key.describe.file=파일 {0}
key.describe.env=환경변수 {0}
key.describe.vault=Vault KV v2 {0}/{1} 필드 {2} (버전 {3}, 토큰: {4})
key.describe.aws=AWS KMS 데이터 키 파일 {0} (KMS 키 {1}, 리전 {2})
key.check.pathEmpty={0}가 비어 있습니다.
key.check.pathInvalid={0}의 경로 형식이 올바르지 않습니다.
key.check.fileMissing={0}의 파일({1})이 없습니다.
