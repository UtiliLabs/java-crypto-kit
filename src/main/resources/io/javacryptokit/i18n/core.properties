# ---- Error format (CredentialCryptoException, CLI, Tomcat Factory) ----
format.reason=[reason: {0}]
exception.causeType=\ (cause type: {0})
exception.action=\ Action: {0}
reason.CONFIGURATION=The config file could not be read, or a setting value or the key selection is invalid.
reason.KEY_SOURCE=The encryption key could not be read, or its format or fingerprint is invalid.
reason.INVALID_INPUT=The input is invalid.
reason.INVALID_TOKEN=The ciphertext format is invalid.
reason.KEY_ID_MISMATCH=No key for the key ID in the ciphertext is registered in these settings.
reason.INTEGRITY=Ciphertext integrity check failed (different key, or the ciphertext was tampered with or damaged).
reason.CRYPTO_PROVIDER=The Java crypto function (AES-256-GCM) is not available.
action.CONFIGURATION=Check the config file path, UTF-8 encoding, entry names and allowed values, and the key ID and type (key list of config show or info), then run CLI info or doctor with the same options.
action.KEY_SOURCE=Check with CLI doctor that this process can read the key's source (crypto.key.source with crypto.key.file or crypto.key.env, key list crypto.keys.<key ID>.*, Vault, AWS KMS), that the value has the right format (AES key: keygen format, Base64 44 characters; passphrase: UTF-8) and that it is the value used at registration.
action.INVALID_INPUT=Make sure the value is not empty or too long (about 12KB of plaintext); for files, check the paths, permissions and free disk space.
action.INVALID_TOKEN=Paste the whole ciphertext line printed by the CLI (starting with ENC or B64 up to the closing bracket) without surrounding spaces; for files, use a file made by file encrypt.
action.KEY_ID_MISMATCH=Check with CLI info that the key used for encryption is registered in this JAR or config. If you changed the key, keep the old key or re-encrypt with rekey.
action.INTEGRITY=Check that the key is the same as at encryption time (compare with CLI fingerprint) and that the ciphertext or file was not truncated or changed.
action.CRYPTO_PROVIDER=Use a Java runtime (latest update) that supports AES-256-GCM.

