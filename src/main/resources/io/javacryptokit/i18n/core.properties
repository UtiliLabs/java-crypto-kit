# java-crypto-kit library messages (English, default bundle). UTF-8.
# Korean: core_ko.properties (must have exactly the same keys - checked by tests).
# Placeholders {0},{1},... receive only safe values (setting names, counts, file names). Never secrets or user input.

# ---- Value origins (info) ----
origin.NONE=none (JAR built-in settings only)
origin.EXPLICIT_PATH=explicit path (CLI --config or CredentialCrypto.fromConfigFile)
origin.JVM_PROPERTY=JVM property -D{0}
origin.ENVIRONMENT=environment variable {0}
value.JAR_DEFAULT=JAR built-in value
value.EXTERNAL_FILE=external config file
value.JVM_PROPERTY=JVM property -D

# ---- Settings loading and validation ----
config.err.pathBlank={0} is set but empty. Specify the external config file path, or remove this setting if you do not use an external config.
config.err.embeddedJvm={0} cannot be given as a JVM property (-D). Do not put the raw key on the command line; supply it with a key file (crypto.key.source=file) or an environment variable (crypto.key.source=env).
config.err.control=The value of {0} must not contain line breaks or control characters.
config.err.choice={0} has a value that is not allowed (allowed: {1}).
config.err.choice.crypto.algorithm=Unsupported encryption algorithm. Only AES/GCM/NoPadding is allowed.
config.err.choice.crypto.key.source=The key source must be one of embedded, file, env, vault, aws-kms.
config.err.choice.crypto.output.encoding=crypto.output.encoding allows only enc or base64.
config.err.choice.crypto.pool.factory=Unapproved JDBC Pool Factory.
config.err.choice.crypto.require.encrypted.password=The policy that requires an encrypted DB password cannot be turned off.
config.err.choice.crypto.lang=crypto.lang allows only ko (default), en or auto.
config.err.boolean={0} allows only true or false.
config.err.number={0} must be an integer from {1} to {2}.
config.err.keyId=The key ID format is invalid.
config.err.format.crypto.vault.url=crypto.vault.url must be https://host[:port] (no path, query or user info; http is not allowed).
config.err.format.crypto.vault.mount=crypto.vault.mount has an invalid format (letters, digits, _ and - separated by /, e.g. secret).
config.err.format.crypto.vault.path=crypto.vault.path has an invalid format (letters, digits, _ - . separated by /, no . or .. segments, e.g. java-crypto-kit/prod).
config.err.format.crypto.vault.field=crypto.vault.field has an invalid format (letters, digits, _ - ., 1-128 characters).
config.err.format.crypto.vault.ver=crypto.vault.ver must be empty (latest version) or an integer of 1 or more.
config.err.format.crypto.vault.token.env=crypto.vault.token.env has an invalid environment variable name (starts with a letter or underscore; letters, digits, underscore only).
config.err.format.crypto.aws.region=crypto.aws.region has an invalid format (e.g. ap-northeast-2). Leave it empty to use the AWS SDK default region settings (AWS_REGION etc.).
config.err.format.crypto.aws.kms.key.id=crypto.aws.kms.key.id has an invalid format (key ID, key ARN, alias/name or alias ARN).
config.err.awsArnRegion=The region in the crypto.aws.kms.key.id ARN differs from crypto.aws.region. Use the same region.
config.err.vaultToken=crypto.key.source=vault needs a Vault token source: set crypto.vault.token.env (environment variable name) or crypto.vault.token.file (token file path).
config.err.required=crypto.key.source={0} requires {1}.
config.err.ambiguousSource=The external config or JVM properties contain key source settings (key file path, key environment variable name, Vault or AWS KMS) but crypto.key.source is missing. Set crypto.key.source to file, env, vault or aws-kms (embedded to use the built-in key).
config.more=\ and {0} more
config.err.unknownExternalUnsafe=The external config file contains an unsupported entry{0} (name not shown: it contains disallowed characters). Check the name=value format and the entry names.
config.err.unknownExternal=The external config file contains the unsupported entry '{0}'{1}. {2}
config.hint.didYouMean=Did you mean '{0}'?
config.hint.seeHelp=All setting names are listed by the CLI command config help.
config.err.jvmTypoUnsafe=A JVM property name that looks like a setting of this library is invalid{0} (name not shown: it contains disallowed characters). Check the names of the -Dcrypto.* options.
config.err.jvmTypo=JVM property '{0}'{1} is not a supported setting name. {2} Stopping because ignoring a typo could run with an unintended key or policy.
config.err.configFileInFile={0} is not an entry of the config file. Specify the external config file path outside the file with -D{0}=<path> or the environment variable {1}.

# ---- Error format (CredentialCryptoException, CLI, Tomcat Factory) ----
format.reason=[reason: {0}]
exception.causeType=\ (cause type: {0})
exception.action=\ Action: {0}
reason.CONFIGURATION=The config file could not be read or a setting value is invalid.
reason.KEY_SOURCE=The encryption key could not be read or its format is invalid.
reason.INVALID_INPUT=The input is invalid.
reason.INVALID_TOKEN=The ciphertext format is invalid.
reason.KEY_ID_MISMATCH=The key ID in the ciphertext differs from the key ID of the current settings.
reason.INTEGRITY=Ciphertext integrity check failed (different key, or the ciphertext was tampered with or damaged).
reason.CRYPTO_PROVIDER=The Java crypto function (AES-256-GCM) is not available.
action.CONFIGURATION=Check the config file path, UTF-8 encoding, entry names and allowed values, then run CLI info or doctor with the same options.
action.KEY_SOURCE=Check with CLI doctor that this process can read the key source for crypto.key.source (key file crypto.key.file, environment variable crypto.key.env, Vault or AWS KMS) and that the key is in keygen format (Base64, 44 characters).
action.INVALID_INPUT=Make sure the value is not empty or too long (about 12KB of plaintext); for files, check the paths, permissions and free disk space.
action.INVALID_TOKEN=Paste the whole ciphertext line printed by the CLI (starting with ENC or B64 up to the closing bracket) without surrounding spaces; for files, use a file made by file encrypt.
action.KEY_ID_MISMATCH=Check with CLI info that the same crypto.key.id and key source as at encryption time are used. If you changed the key, re-encrypt with rekey.
action.INTEGRITY=Check that the key is the same as at encryption time (compare with CLI fingerprint) and that the ciphertext or file was not truncated or changed.
action.CRYPTO_PROVIDER=Use a Java runtime (latest update) that supports AES-256-GCM.

# ---- Tokens and the string cipher ----
token.err.null=The value is missing.
token.err.prefix=It is not in ENC[...] or B64[...] format.
token.err.b64Length=The length or brackets of the B64 wrapper are invalid.
token.err.b64Chars=The B64 wrapper is not unpadded Base64URL.
token.err.b64Decode=The B64 wrapper cannot be decoded.
token.err.b64Canonical=The B64 wrapper is not in canonical Base64URL form.
token.err.b64Utf8=The value inside the B64 wrapper is not valid UTF-8.
token.err.b64Inner=The B64 wrapper does not contain an ENC[v1:...] ciphertext (nested wrapping is not allowed).
cipher.err.notEncodable=It contains characters that cannot be represented in UTF-8.
cipher.err.tooLong=The value to encrypt is too long (ciphertext max 16,384 characters, about 12KB of plaintext).
cipher.err.length=The IV or ciphertext length is invalid.
cipher.err.notUtf8=The decrypted result is not UTF-8 text. Use decryptBytes for binary data.
cipher.err.format=It is not in ENC[v1:...] format or exceeds the allowed length.
cipher.err.version=Unsupported ciphertext version or key ID format.
cipher.err.base64=The Base64URL encoding of the ciphertext is invalid.
service.err.empty=The value is empty.
service.err.configRead=Check the external config file path, that it exists, that it is saved as UTF-8 and its format.
service.err.keyRead=Check the key file or key source path, existence, read permission and connection.
api.err.configPath=The config file path is missing.
api.err.filePath=The input or output file path is missing.

