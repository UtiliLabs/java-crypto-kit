key.describe.fileNone=file (path not set)
key.describe.file=file {0}
key.describe.env=environment variable {0}
key.describe.vault=Vault KV v2 {0}/{1} field {2} (version {3}, token: {4})
key.describe.aws=AWS KMS data key file {0} (KMS key {1}, region {2})
key.check.pathEmpty={0} is empty.
key.check.pathInvalid={0} has an invalid path format.
key.check.fileMissing=The file of {0} ({1}) does not exist.
key.check.fileUnreadable=This account cannot read the file of {0} ({1}).
key.check.fileOk=The file of {0} ({1}) is readable.
key.check.filePermissive=The file of {0} ({1}) can be read by the group or other users.
key.check.embedded=The JAR built-in key is used (anyone with the JAR can extract it).
key.check.envMissing=Environment variable {0} is missing or empty.
key.check.envOk=Environment variable {0} exists ({1} characters, value not shown).
key.action.setPath=Set {0} to the correct file path.
key.action.fileAccess=Check that the file exists and that the account running WAS/CLI has read permission.
key.action.chmod=Restrict permissions so only the WAS account can read it (Linux: chmod 600, Windows: icacls).
key.action.envName=Set {0} to a valid environment variable name.
key.action.envExport=Pass environment variable {0} to the process (Linux: export / systemd Environment, Windows: setx or service settings).
warn.inheritedNote=\ The external config or JVM properties do not set crypto.key.source, so the default embedded was applied.
warn.publicKey=The public default key is in use (key source: {0}). Anyone can decrypt ciphertext made with this key. In production, use your own key: config embed-key, an external key (file/env), Vault or AWS KMS.
warn.embeddedKey=A JAR built-in key (embedded) is in use. A built-in key can be extracted from the JAR, so manage the JAR like a secret file, or use an external key (file/env/vault/aws-kms) in production.

# ---- Vault KV v2 ----
key.vault.latest=latest
key.vault.tokenFromEnv=environment variable {0}
key.vault.tokenFromFile=file {0}
key.action.vaultSettings=Set crypto.vault.url, crypto.vault.mount, crypto.vault.path and crypto.vault.field (see help vault).
key.vault.err.tokenEnvMissing=The Vault token environment variable {0} is missing or empty. Check that the token is passed to the WAS service process (or the shell that runs the CLI).
key.vault.err.tokenFormat=The Vault token format is invalid ({0}). It must be a single line without spaces or line breaks.
key.vault.err.ca=Could not read the Vault CA certificate file (crypto.vault.ca.file). Check that it is a PEM X.509 file.
key.vault.err.tls=The TLS certificate of the Vault server is not trusted or the server name does not match the certificate. Certificate verification cannot be disabled. Check the host name in crypto.vault.url and crypto.vault.ca.file (private CA).
key.vault.err.timeout=The Vault response exceeded the time limit (crypto.vault.timeout.ms) after {0} attempts.
key.vault.err.network=Could not connect to the Vault server after {0} attempts (check address, port, firewall and DNS).
key.vault.err.auth=Vault rejected authentication (the token is missing, expired or revoked). Issue a new token and put it in the token file or environment variable.
key.vault.err.permission=The Vault token is valid but has no permission to read this secret. Grant read on <mount>/data/<path> in the policy. Vault answers "permission denied" instead of "not found" for paths outside the policy, so also check crypto.vault.mount and crypto.vault.path.
key.vault.err.notFound=The Vault secret or the given version was not found (check crypto.vault.mount, crypto.vault.path, crypto.vault.ver, and that the mount is KV v2).
key.vault.err.deleted=This version of the Vault secret was deleted (or destroyed). Specify another version or restore the secret.
key.vault.err.field=The Vault secret has no field {0}, or it is not a string (check crypto.vault.field).
key.vault.err.redirect=Vault redirected to another address. Redirects are not followed to protect the token. Set crypto.vault.url to the active node or load balancer address.
key.vault.err.unavailable=Vault could not process the request temporarily (HTTP {0}; sealed, standby node or overload). Restart WAS after the problem is resolved.
key.vault.err.status=Vault returned an unexpected response (HTTP {0}).
key.vault.err.response=The Vault response format is invalid (not a KV v2 response).
key.check.vaultTokenEnv=Vault token environment variable {0} exists (value not shown).
key.check.vaultDefaultTrust=The Vault server certificate is verified with the JVM default trust store (crypto.vault.ca.file not set).
key.check.vaultLatest=crypto.vault.ver is not set, so the latest secret version is read. If a new version is written, a different key applies from the next restart and existing ciphertext may fail to decrypt.
key.action.vaultPinVersion=Pin the version with crypto.vault.ver.

# ---- AWS KMS ----
key.aws.regionDefault=AWS SDK default
key.check.awsSdk=AWS SDK 2.x (KMS, URLConnection HTTP client) is installed.
key.aws.err.sdkMissing=The AWS SDK for Java 2.x needed for aws-kms is not installed. Basic use (embedded/file/env/vault) does not need it.
key.action.awsSdk=Put the JARs from java-crypto-kit-aws-kms-lib-<version>.zip next to java-crypto-kit JAR (Tomcat: CATALINA_BASE/lib; CLI: java -cp). See help aws-kms.
key.action.awsSettings=Set crypto.aws.kms.key.id and crypto.aws.kms.data-key.file (create the data key file with kms datakey).
key.check.awsDataKeyFormat=The data key file has a valid format (encrypted data key, not secret by itself).
key.aws.err.dataKeyFormat=The data key file (crypto.aws.kms.data-key.file) is not a Base64 encrypted data key made by kms datakey.
key.action.awsDataKey=Create the data key file again with kms datakey, or specify the correct file.
key.check.awsRegionDefault=crypto.aws.region is not set, so the AWS SDK default region chain is used (AWS_REGION, profile, EC2 metadata).
key.check.awsRegion=AWS region: {0}
key.check.awsEndpoint=The KMS endpoint is overridden by {0} (SDK standard setting).
key.check.awsEndpointHttp=The KMS endpoint set by {0} is not HTTPS.
key.action.awsEndpoint=Use an HTTPS endpoint in production (http only for local emulators).
key.check.awsJvmCredential=AWS credential JVM property -D{0} is set (visible in the process list and startup logs).
key.action.awsJvmCredential=Do not pass AWS credentials with -D. Use an IAM role, a profile or environment variables.
key.aws.err.timeout=The AWS KMS request exceeded the time limit (crypto.aws.kms.timeout.ms, retries included).
key.aws.err.client=The AWS SDK request failed ({0}).
key.aws.err.accessDenied=AWS KMS denied access (AccessDeniedException). Check kms:Decrypt (and GenerateDataKey/Encrypt for kms datakey) in the IAM policy and the key policy.
key.aws.err.incorrectKey=The data key was encrypted with a different KMS key than crypto.aws.kms.key.id (IncorrectKeyException).
key.aws.err.invalidCiphertext=AWS KMS could not decrypt the data key (InvalidCiphertextException). The data key file is damaged, or crypto.key.id (encryption context) differs from when the data key was created.
key.aws.err.notFound=The KMS key was not found (NotFoundException). Check crypto.aws.kms.key.id and that the region and account are right.
key.aws.err.disabled=The KMS key is disabled or in a state that cannot be used (DisabledException / KMSInvalidStateException).
key.aws.err.keyUsage=The KMS key cannot be used for encryption (InvalidKeyUsageException). Use a symmetric ENCRYPT_DECRYPT key.
key.aws.err.auth=AWS rejected the credentials (invalid, expired or wrong signature). Check the IAM role, profile or environment variable credentials.
key.aws.err.unavailable=AWS KMS is temporarily unavailable ({0}). Restart WAS after the problem is resolved.
key.aws.err.service=AWS KMS returned an error ({0}).
key.aws.err.credentials=No AWS credentials were found in the AWS SDK standard chain (environment variables, web identity, profile, container, EC2 instance profile).
key.aws.err.region=No AWS region was found. Set crypto.aws.region or AWS_REGION.
key.aws.err.tls=The TLS certificate of the AWS endpoint is not trusted (check proxy or JVM trust store).
key.aws.err.network=Could not connect to AWS KMS (check network, proxy, DNS and VPC endpoint).

