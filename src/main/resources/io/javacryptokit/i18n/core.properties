key.err.envName={0} has an invalid environment variable name (starts with a letter or underscore; letters, digits, underscore only).
key.err.base64=The key must be standard Base64. Check that it is a value made by keygen (one line of 44 characters).
key.err.length=An AES-256 key must be exactly 32 bytes. Check that it is a standard Base64 key made by keygen (44 characters).
key.describe.embedded=JAR built-in ({0})
