# config help 설정 설명(한국어). UTF-8. 영어 기본 번들 settings.properties와 키가 정확히 같아야 한다(테스트가 검사).
# config.SettingCatalog의 모든 설정은 두 언어 모두 .purpose .allowed .example(.notes 선택)이 있어야 한다.
# 이름·자료형·기본값·-D 규칙은 코드에서 생성하고, 여기에는 설명만 둔다.

setting.crypto.key.source.purpose=AES-256 키를 어디서 가져올지 정한다.
setting.crypto.key.source.allowed=embedded(JAR 내장 키), file(crypto.key.file), env(crypto.key.env), vault(Vault KV v2), aws-kms(AWS KMS 데이터 키)
setting.crypto.key.source.notes=선택한 외부 키를 읽지 못하면 실패하며 내장 키로 바꾸지 않는다. 외부 Properties나 -D에 키 파일·키 환경변수·Vault·KMS 설정을 적었다면 이 항목도 함께 적는다.
setting.crypto.key.source.example=java -jar {jar} config set crypto.key.source=file crypto.key.file=/etc/java-crypto-kit/crypto.key --operator example-admin --yes

setting.crypto.key.id.purpose=키의 논리적 이름. 모든 암호문(ENC[v1:<키ID>:...])에 기록되고 인증(AAD)에 포함된다.
setting.crypto.key.id.allowed=영문·숫자·_·-, 1~64자(예: default, prod01)
setting.crypto.key.id.values=영문/숫자/_/- 1~64자
setting.crypto.key.id.notes=새 키에는 새 키ID를 쓴다. 키ID만 바꾼다고 키가 바뀌지 않으며, 이전 키ID의 암호문은 rekey로 다시 암호화한다.
setting.crypto.key.id.example=-Dcrypto.key.id=prod01

setting.crypto.key.file.purpose=crypto.key.source=file의 키 파일. keygen으로 만든 표준 Base64 한 줄.
setting.crypto.key.file.allowed=일반 파일 경로(최대 512바이트). 일반 파일을 가리키는 심볼릭 링크 허용
setting.crypto.key.file.values=키 파일 경로
setting.crypto.key.file.notes=Windows 경로도 / 로 쓴다(C:/secure/crypto.key). WAS 실행 계정만 읽도록 권한을 제한한다(chmod 600 / icacls).
setting.crypto.key.file.example=crypto.key.file=/etc/java-crypto-kit/crypto.key

setting.crypto.key.env.purpose=crypto.key.source=env에서 Base64 키를 담은 환경변수의 "이름"(키 값이 아님).
setting.crypto.key.env.allowed=영문·_로 시작, 영문·숫자·_ (최대 128자)
setting.crypto.key.env.values=환경변수 이름
setting.crypto.key.env.notes=WAS 서비스 프로세스에 변수가 전달되어야 한다(systemd Environment, Windows 서비스 설정, setenv).
setting.crypto.key.env.example=-Dcrypto.key.source=env -Dcrypto.key.env=CRYPTO_KEY

setting.crypto.key.embedded.purpose=crypto.key.source=embedded의 내장 AES-256 키(비밀 항목, 출력하지 않음).
setting.crypto.key.embedded.allowed=정확히 32바이트 난수의 표준 Base64(44자). JAR 값은 config embed-key로만 변경(config set·-D 불가). 외부 Properties에도 쓸 수 있지만 권장하지 않음(crypto.key.source=file 또는 env 사용)
setting.crypto.key.embedded.values=config embed-key로만 변경
setting.crypto.key.embedded.notes=기본값은 공개 예제 키라 누구나 복호화할 수 있다. 운영 전에 config embed-key로 교체한다(새 키ID 필수). 내장 키는 JAR에서 추출할 수 있으므로 키 내장 JAR는 비밀 파일처럼 관리한다.
setting.crypto.key.embedded.example=java -jar {jar} config embed-key --from-file example.key --key-id prod01 --operator example-admin

setting.crypto.algorithm.purpose=암호화 알고리즘(명시용으로 유지).
setting.crypto.algorithm.allowed=AES/GCM/NoPadding만(AES-256 키, 12바이트 난수 IV, 128비트 태그)
setting.crypto.algorithm.notes=다른 값은 거부한다. 약한 방식으로 낮출 수 없다.
setting.crypto.algorithm.example=crypto.algorithm=AES/GCM/NoPadding

setting.crypto.lang.purpose=이 라이브러리가 만드는 모든 메시지의 언어: CLI 도움말·결과, Java API 예외, Tomcat Factory 오류·로그, Vault/KMS 오류.
setting.crypto.lang.allowed=ko(한국어, 기본), en(영어), auto(JVM Locale: 한국어면 ko, 그 밖의 언어·미지원 언어는 en)
setting.crypto.lang.notes=CLI 옵션 --lang en|ko는 그 실행에만 적용되며 이 설정을 바꾸지 않는다. Tomcat·JDBC 드라이버·AWS SDK가 직접 출력하는 메시지는 번역하지 않는다. 콘솔 문자 인코딩은 언어와 별개다(한국어는 UTF-8 콘솔 권장).
setting.crypto.lang.example=java -jar {jar} config set crypto.lang=en --operator example-admin

setting.crypto.warning.enabled.purpose=공개 기본 키 사용 경고([WARN] 한 줄, JVM당 1회) 출력 여부.
setting.crypto.warning.enabled.allowed=true, false(소문자)
setting.crypto.warning.enabled.notes=false면 이 경고 한 줄만 나오지 않는다. 오류·진단(info, doctor) 결과는 그대로이고 공개 키로 만든 암호문의 위험도 그대로다.
setting.crypto.warning.enabled.example=-Dcrypto.warning.enabled=false

setting.crypto.output.encoding.purpose=encrypt·rekey의 출력 형식.
setting.crypto.output.encoding.allowed=enc(ENC[v1:...] 그대로), base64(B64[...]로 한 번 더 감쌈)
setting.crypto.output.encoding.notes=B64는 인코딩일 뿐 보안을 높이지 않는다. 복호화는 이 설정과 관계없이 두 형식을 모두 받는다.
setting.crypto.output.encoding.example=crypto.output.encoding=base64

setting.crypto.jvm.override.enabled.purpose=-Dcrypto.* JVM 속성으로 설정을 덮어쓸 수 있는지.
setting.crypto.jvm.override.enabled.allowed=true, false
setting.crypto.jvm.override.enabled.notes=JAR와 외부 Properties만으로 정한다. -Dcrypto.jvm.override.enabled 자체는 무시한다(우회 불가). -Dcrypto.config.file은 계속 동작한다. 절대적인 보안 경계는 아니다.
setting.crypto.jvm.override.enabled.example=java -jar {jar} config set crypto.jvm.override.enabled=false --operator example-admin

setting.crypto.pool.factory.purpose=Tomcat 어댑터가 위임할 Tomcat 공식 Pool Factory.
setting.crypto.pool.factory.allowed=org.apache.tomcat.dbcp.dbcp2.BasicDataSourceFactory(DBCP2, 기본), org.apache.tomcat.jdbc.pool.DataSourceFactory(Tomcat JDBC Pool)
setting.crypto.pool.factory.notes=Resource의 factory 속성은 항상 io.javacryptokit.jdbc.tomcat.EncryptedDataSourceFactory다. Pool 라이브러리는 이 JAR와 같은 CATALINA_BASE/lib에 있어야 한다(웹앱 클래스로더는 쓰지 않음). 이 값은 한 Tomcat JVM의 모든 Resource에 공통으로 적용되며, Resource마다 다른 Pool이 필요하면 Tomcat 인스턴스를 나눈다.
setting.crypto.pool.factory.example=-Dcrypto.pool.factory=org.apache.tomcat.jdbc.pool.DataSourceFactory

setting.crypto.require.encrypted.password.purpose=암호문이 아닌 Resource password를 거부한다.
setting.crypto.require.encrypted.password.allowed=true만(false는 거부)
setting.crypto.require.encrypted.password.example=crypto.require.encrypted.password=true

setting.crypto.vault.url.purpose=crypto.key.source=vault의 Vault 서버 주소.
setting.crypto.vault.url.allowed=https://호스트[:포트](경로·쿼리·사용자 정보 불가, http 거부)
setting.crypto.vault.url.values=https://호스트[:포트]
setting.crypto.vault.url.notes=인증서와 호스트 이름은 항상 검증한다(끌 수 없음). 리다이렉트는 따르지 않는다.
setting.crypto.vault.url.example=crypto.vault.url=https://vault.example.internal:8200

setting.crypto.vault.mount.purpose=KV 버전 2 시크릿 엔진의 마운트 경로.
setting.crypto.vault.mount.allowed=영문·숫자·_·- 를 / 로 구분(예: secret)
setting.crypto.vault.mount.values=KV v2 마운트 경로
setting.crypto.vault.mount.example=crypto.vault.mount=secret

setting.crypto.vault.path.purpose=마운트 아래 Secret 경로(GET /v1/<마운트>/data/<경로>로 읽음).
setting.crypto.vault.path.allowed=영문·숫자·_·-·. 를 / 로 구분(. 또는 .. 구간 불가)
setting.crypto.vault.path.values=Secret 경로
setting.crypto.vault.path.example=crypto.vault.path=java-crypto-kit/prod

setting.crypto.vault.field.purpose=Base64 AES-256 키(keygen 형식)가 들어 있는 Secret 필드 이름.
setting.crypto.vault.field.allowed=영문·숫자·_·-·., 1~128자
setting.crypto.vault.field.values=Secret 필드 이름
setting.crypto.vault.field.example=crypto.vault.field=key

setting.crypto.vault.ver.purpose=읽을 Secret 버전.
setting.crypto.vault.ver.allowed=비움(최신 버전) 또는 1 이상의 정수
setting.crypto.vault.ver.values=1 이상 정수, 비우면 최신
setting.crypto.vault.ver.notes=비우면 읽을 때마다 최신 버전을 쓴다. Secret에 새 버전을 쓰면 다음 재시작부터 다른 키가 적용되어 기존 암호문이 복호화되지 않을 수 있다.
setting.crypto.vault.ver.example=crypto.vault.ver=3

setting.crypto.vault.token.env.purpose=Vault 토큰을 담은 환경변수 이름(crypto.vault.token.file이 비어 있을 때 사용).
setting.crypto.vault.token.env.allowed=환경변수 이름(기본 VAULT_TOKEN)
setting.crypto.vault.token.env.values=환경변수 이름
setting.crypto.vault.token.env.notes=토큰 원문은 Properties·-D에 두지 않는다.
setting.crypto.vault.token.env.example=crypto.vault.token.env=VAULT_TOKEN

setting.crypto.vault.token.file.purpose=Vault 토큰 파일(한 줄). 지정하면 crypto.vault.token.env 대신 사용한다.
setting.crypto.vault.token.file.allowed=일반 파일 경로(최대 8KB)
setting.crypto.vault.token.file.values=토큰 파일 경로
setting.crypto.vault.token.file.notes=WAS 실행 계정만 읽도록 권한을 제한한다. Vault Agent의 sink 파일과 함께 쓸 수 있다.
setting.crypto.vault.token.file.example=crypto.vault.token.file=/run/secrets/vault-token

setting.crypto.vault.ca.file.purpose=Vault 서버 인증서를 검증할 PEM CA 인증서(사설 CA용).
setting.crypto.vault.ca.file.allowed=비움(JVM 기본 신뢰 저장소) 또는 PEM 파일(최대 1MB)
setting.crypto.vault.ca.file.values=PEM 파일, 비우면 JVM 기본
setting.crypto.vault.ca.file.notes=지정하면 Vault에 대해 이 CA만 신뢰한다. JVM 전체 신뢰 저장소는 바꾸지 않는다.
setting.crypto.vault.ca.file.example=crypto.vault.ca.file=/etc/java-crypto-kit/vault-ca.pem

setting.crypto.vault.timeout.ms.purpose=Vault 요청 1회의 연결·응답 제한 시간(밀리초).
setting.crypto.vault.timeout.ms.allowed=정수 100~60000(기본 5000)
setting.crypto.vault.timeout.ms.notes=일시 장애(연결 실패·시간 초과·HTTP 429/5xx)만 최대 3회 시도한다. TLS·인증·권한·Secret 없음 오류는 다시 시도하지 않는다.
setting.crypto.vault.timeout.ms.example=crypto.vault.timeout.ms=3000

setting.crypto.aws.region.purpose=KMS 키의 AWS 리전.
setting.crypto.aws.region.allowed=비움(AWS SDK 기본 리전 체계: AWS_REGION, 프로필, EC2 메타데이터) 또는 ap-northeast-2 같은 리전
setting.crypto.aws.region.values=리전, 비우면 SDK 기본
setting.crypto.aws.region.example=crypto.aws.region=ap-northeast-2

setting.crypto.aws.kms.key.id.purpose=데이터 키를 보호하는 KMS 키(GenerateDataKey·Encrypt·Decrypt의 KeyId).
setting.crypto.aws.kms.key.id.allowed=키 ID, 키 ARN, alias/<이름>, 별칭 ARN
setting.crypto.aws.kms.key.id.values=키 ID, ARN, alias/<이름>
setting.crypto.aws.kms.key.id.notes=Decrypt를 이 KeyId로 호출하므로 다른 KMS 키로 만든 데이터 키는 거부된다. 키 ARN의 리전은 crypto.aws.region과 같아야 한다.
setting.crypto.aws.kms.key.id.example=crypto.aws.kms.key.id=alias/java-crypto-kit-prod

setting.crypto.aws.kms.data-key.file.purpose=kms datakey로 한 번 만든 암호화된 데이터 키(Base64 CiphertextBlob) 파일.
setting.crypto.aws.kms.data-key.file.allowed=일반 파일 경로(최대 16KB)
setting.crypto.aws.kms.data-key.file.values=데이터 키 파일 경로
setting.crypto.aws.kms.data-key.file.notes=이 파일을 보관한다. 시작할 때마다 같은 데이터 키를 복원한다. Encryption Context java-crypto-kit:key-id로 crypto.key.id에 묶인다.
setting.crypto.aws.kms.data-key.file.example=crypto.aws.kms.data-key.file=/etc/java-crypto-kit/prod.datakey

setting.crypto.aws.kms.timeout.ms.purpose=KMS 호출 1회의 전체 제한 시간(밀리초, AWS SDK 표준 재시도 포함).
setting.crypto.aws.kms.timeout.ms.allowed=정수 500~120000(기본 10000)
setting.crypto.aws.kms.timeout.ms.example=crypto.aws.kms.timeout.ms=5000
setting.crypto.key.type.purpose=유형·키 ID를 정하지 않은 새 암호화의 유형(pass = Passphrase, key = AES Key).
setting.crypto.key.type.allowed=pass(기본), key
setting.crypto.key.type.notes=바꾸면 이후 새 암호화에 쓰는 키가 바뀐다. 기존 암호문 복호화는 암호문의 키 ID로 키를 고르므로 영향이 없다. 이전 형식처럼 AES 키만 쓰려면 key로 둔다.
setting.crypto.key.type.example=crypto.key.type=key
setting.crypto.key.active.pass.purpose=pass 유형의 기본 키 ID(--type pass와 유형 생략 암호화가 쓰는 키).
setting.crypto.key.active.pass.allowed=등록된 pass 키의 키 ID(기본 pass-default)
setting.crypto.key.active.pass.values=pass 키의 키 ID
setting.crypto.key.active.pass.notes=키를 추가해도 저절로 바뀌지 않는다. config key use --key-id <ID>로 바꾼다.
setting.crypto.key.active.pass.example=crypto.key.active.pass=pass-default
setting.crypto.key.active.key.purpose=key 유형의 기본 키 ID(--type key가 쓰는 키).
setting.crypto.key.active.key.allowed=비움(= crypto.key.*의 기존 AES 키) 또는 등록된 key 키의 키 ID
setting.crypto.key.active.key.values=비움 또는 key 키의 키 ID
setting.crypto.key.active.key.notes=비워 두면 기존 AES 키 슬롯(crypto.key.*)이 key 기본 키라 이전 형식 설정이 그대로 동작한다. config key use --type key --key-id <ID>로 바꾼다.
setting.crypto.key.active.key.example=crypto.key.active.key=default
setting.profile.type.purpose=키 유형: pass(Passphrase 파생 키) 또는 key(AES 키).
setting.profile.type.values=pass|key
setting.profile.source.purpose=키 재료를 읽는 곳.
setting.profile.source.values=embedded|file|env|vault|aws-kms
setting.profile.embedded.purpose=JAR 안의 키(표준 Base64 32바이트, pass는 파생 키). 비밀이며 표시하지 않는다.
setting.profile.embedded.values=(비공개)
setting.profile.file.purpose=file 공급원의 파일(key는 Base64 한 줄, pass는 Passphrase 한 줄).
setting.profile.file.values=파일 경로
setting.profile.env.purpose=env 공급원의 환경변수 이름(값은 key: Base64, pass: Passphrase).
setting.profile.env.values=환경변수 이름
setting.profile.vault.path.purpose=vault 공급원의 Secret 경로(연결은 crypto.vault.* 공통 설정).
setting.profile.vault.path.values=Secret 경로
setting.profile.vault.field.purpose=vault 공급원의 필드 이름(비우면 crypto.vault.field).
setting.profile.vault.field.values=필드 이름
setting.profile.vault.ver.purpose=vault 공급원의 Secret 버전(비우면 최신).
setting.profile.vault.ver.values=버전 번호
setting.profile.aws.kms.data-key.file.purpose=aws-kms 공급원의 데이터 키 파일(KMS로 감싼 키, pass는 파생 키).
setting.profile.aws.kms.data-key.file.values=파일 경로
setting.profile.kdf.purpose=pass 키의 파생 방식(PBKDF2-HMAC-SHA256).
setting.profile.kdf.values=pbkdf2-sha256
setting.profile.kdf.iterations.purpose=pass 키의 파생 반복 횟수(새 키 기본 600000).
setting.profile.kdf.iterations.values=100000~5000000
setting.profile.salt.purpose=pass 키의 Salt(무작위 16바이트, 표준 Base64). 키마다 다르다.
setting.profile.salt.values=Base64 16바이트
setting.profile.fingerprint.purpose=외부 공급 키의 고정 지문(등록할 때 확인한 키). 다르면 사용하지 않는다.
setting.profile.fingerprint.values=지문 64자
