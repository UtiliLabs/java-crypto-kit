# Setting descriptions for "config help" (English, default bundle). UTF-8. Korean: settings_ko.properties.
# Every setting of config.SettingCatalog needs .purpose .allowed .example (.notes optional) in both languages (checked by tests).
# Names, types, defaults and -D rules are generated from the code; only the descriptions live here.

setting.crypto.key.source.purpose=Where the AES-256 key comes from.
setting.crypto.key.source.allowed=embedded (key inside the JAR), file (crypto.key.file), env (crypto.key.env), vault (Vault KV v2), aws-kms (AWS KMS data key)
setting.crypto.key.source.notes=If the selected external key cannot be read, it fails and never falls back to the built-in key. When a key file, key variable, Vault or KMS setting is given in external Properties or -D, set this too.
setting.crypto.key.source.example=java -jar {jar} config set crypto.key.source=file crypto.key.file=/etc/java-crypto-kit/crypto.key --operator example-admin --yes

setting.crypto.key.id.purpose=Logical name of the key, written into every ciphertext (ENC[v1:<key ID>:...]) and authenticated (AAD).
setting.crypto.key.id.allowed=letters, digits, _ and -, 1-64 characters (e.g. default, prod01)
setting.crypto.key.id.notes=Use a new key ID for a new key. Changing it does not change the key; ciphertext of the old key ID must be re-encrypted with rekey.
setting.crypto.key.id.example=-Dcrypto.key.id=prod01

setting.crypto.key.file.purpose=Key file for crypto.key.source=file: one line of standard Base64 made by keygen.
setting.crypto.key.file.allowed=path of a regular file (max 512 bytes); symbolic links to a regular file are allowed
setting.crypto.key.file.notes=Use / in Windows paths (C:/secure/crypto.key). Restrict read access to the WAS account (chmod 600 / icacls).
setting.crypto.key.file.example=crypto.key.file=/etc/java-crypto-kit/crypto.key

setting.crypto.key.env.purpose=Name of the environment variable that holds the Base64 key for crypto.key.source=env (the name only, not the key).
setting.crypto.key.env.allowed=starts with a letter or _, then letters, digits, _ (max 128)
setting.crypto.key.env.notes=The variable must reach the WAS service process (systemd Environment, Windows service settings, setenv).
setting.crypto.key.env.example=-Dcrypto.key.source=env -Dcrypto.key.env=CRYPTO_KEY

setting.crypto.key.embedded.purpose=Built-in AES-256 key for crypto.key.source=embedded (secret, never printed).
setting.crypto.key.embedded.allowed=exactly 32 random bytes in standard Base64 (44 characters); the JAR value changes only with config embed-key (not config set, never -D). An external Properties file may also contain it, but this is not recommended: use crypto.key.source=file or env
setting.crypto.key.embedded.notes=The default is a PUBLIC example key: anyone can decrypt with it. Replace it before production with config embed-key (a new key ID is required). A built-in key can be extracted from the JAR, so manage the key-embedded JAR like a secret file.
setting.crypto.key.embedded.example=java -jar {jar} config embed-key --from-file example.key --key-id prod01 --operator example-admin

setting.crypto.algorithm.purpose=Encryption algorithm (kept for explicitness).
setting.crypto.algorithm.allowed=AES/GCM/NoPadding only (AES-256 key, 12-byte random IV, 128-bit tag)
setting.crypto.algorithm.notes=Any other value is rejected; it cannot be downgraded.
setting.crypto.algorithm.example=crypto.algorithm=AES/GCM/NoPadding

setting.crypto.lang.purpose=Language of all messages made by this library: CLI help and results, Java API exceptions, Tomcat Factory errors and logs, Vault/KMS errors.
setting.crypto.lang.allowed=ko (Korean, default), en (English), auto (JVM locale: Korean -> ko, any other or unsupported language -> en)
setting.crypto.lang.notes=The CLI option --lang en|ko applies to one run only and does not change this setting. Messages printed directly by Tomcat, JDBC drivers or the AWS SDK are not translated. The console character encoding is separate from the language (use a UTF-8 console for Korean).
setting.crypto.lang.example=java -jar {jar} config set crypto.lang=en --operator example-admin

setting.crypto.warning.enabled.purpose=Show the non-blocking key-risk WARNINGs (public default key, extractable built-in key).
setting.crypto.warning.enabled.allowed=true, false (lower case)
setting.crypto.warning.enabled.notes=false hides only these advisory warnings (once per JVM and type). Errors, the decrypt confirmation and explicit diagnostics (info, doctor) are not affected, and the risk does not go away.
setting.crypto.warning.enabled.example=-Dcrypto.warning.enabled=false

setting.crypto.output.encoding.purpose=Output format of encrypt and rekey.
setting.crypto.output.encoding.allowed=enc (ENC[v1:...] as is), base64 (wrapped once more as B64[...])
setting.crypto.output.encoding.notes=B64 is only an encoding, not extra security. Decryption accepts both formats regardless of this setting.
setting.crypto.output.encoding.example=crypto.output.encoding=base64

setting.crypto.jvm.override.enabled.purpose=Whether -Dcrypto.* JVM properties may override settings.
setting.crypto.jvm.override.enabled.allowed=true, false
setting.crypto.jvm.override.enabled.notes=Decided only by the JAR and the external Properties; -Dcrypto.jvm.override.enabled itself is ignored (no bypass). -Dcrypto.config.file still works. Not an absolute security boundary.
setting.crypto.jvm.override.enabled.example=java -jar {jar} config set crypto.jvm.override.enabled=false --operator example-admin

setting.crypto.pool.factory.purpose=Official Tomcat pool factory that the Tomcat adapter delegates to.
setting.crypto.pool.factory.allowed=org.apache.tomcat.dbcp.dbcp2.BasicDataSourceFactory (DBCP2, default), org.apache.tomcat.jdbc.pool.DataSourceFactory (Tomcat JDBC Pool)
setting.crypto.pool.factory.notes=The Resource factory attribute is always io.javacryptokit.jdbc.tomcat.EncryptedDataSourceFactory. The pool library must be in CATALINA_BASE/lib with this JAR (the web application class loader is never used). The value applies to every Resource of the Tomcat JVM; use separate Tomcat instances if Resources need different pools.
setting.crypto.pool.factory.example=-Dcrypto.pool.factory=org.apache.tomcat.jdbc.pool.DataSourceFactory

setting.crypto.require.encrypted.password.purpose=Reject a Resource password that is not a ciphertext.
setting.crypto.require.encrypted.password.allowed=true only (false is rejected)
setting.crypto.require.encrypted.password.example=crypto.require.encrypted.password=true

setting.crypto.vault.url.purpose=Vault server address for crypto.key.source=vault.
setting.crypto.vault.url.allowed=https://host[:port] (no path, query or user info; http is rejected)
setting.crypto.vault.url.notes=The certificate and host name are always verified (cannot be disabled). Redirects are not followed.
setting.crypto.vault.url.example=crypto.vault.url=https://vault.example.internal:8200

setting.crypto.vault.mount.purpose=KV version 2 secrets engine mount path.
setting.crypto.vault.mount.allowed=letters, digits, _ and - separated by / (e.g. secret)
setting.crypto.vault.mount.example=crypto.vault.mount=secret

setting.crypto.vault.path.purpose=Secret path under the mount (read with GET /v1/<mount>/data/<path>).
setting.crypto.vault.path.allowed=letters, digits, _ - . separated by / (no . or .. segments)
setting.crypto.vault.path.example=crypto.vault.path=java-crypto-kit/prod

setting.crypto.vault.field.purpose=Field of the secret that holds the Base64 AES-256 key (as made by keygen).
setting.crypto.vault.field.allowed=letters, digits, _ - ., 1-128 characters
setting.crypto.vault.field.example=crypto.vault.field=key

setting.crypto.vault.ver.purpose=Secret version to read.
setting.crypto.vault.ver.allowed=empty (latest version) or an integer of 1 or more
setting.crypto.vault.ver.notes=Pinning is recommended: with the latest version, writing a new version changes the key at the next restart and existing ciphertext can no longer be decrypted.
setting.crypto.vault.ver.example=crypto.vault.ver=3

setting.crypto.vault.token.env.purpose=Name of the environment variable that holds the Vault token (used when crypto.vault.token.file is empty).
setting.crypto.vault.token.env.allowed=environment variable name (default VAULT_TOKEN)
setting.crypto.vault.token.env.notes=The token itself is never put in Properties or -D.
setting.crypto.vault.token.env.example=crypto.vault.token.env=VAULT_TOKEN

setting.crypto.vault.token.file.purpose=File that holds the Vault token (one line). When set, it is used instead of crypto.vault.token.env.
setting.crypto.vault.token.file.allowed=path of a regular file (max 8KB)
setting.crypto.vault.token.file.notes=Restrict read access to the WAS account. Works with Vault Agent sink files.
setting.crypto.vault.token.file.example=crypto.vault.token.file=/run/secrets/vault-token

setting.crypto.vault.ca.file.purpose=PEM CA certificate(s) trusted for the Vault server (for a private CA).
setting.crypto.vault.ca.file.allowed=empty (JVM default trust store) or a PEM file (max 1MB)
setting.crypto.vault.ca.file.notes=When set, only these CAs are trusted for Vault; the JVM-wide trust store is not changed.
setting.crypto.vault.ca.file.example=crypto.vault.ca.file=/etc/java-crypto-kit/vault-ca.pem

setting.crypto.vault.timeout.ms.purpose=Connect and read time limit of one Vault attempt in milliseconds.
setting.crypto.vault.timeout.ms.allowed=integer 100-60000 (default 5000)
setting.crypto.vault.timeout.ms.notes=Temporary failures (connection, timeout, HTTP 429/5xx) are tried at most 3 times; TLS, authentication, permission and missing-secret errors are not retried.
setting.crypto.vault.timeout.ms.example=crypto.vault.timeout.ms=3000

setting.crypto.aws.region.purpose=AWS region of the KMS key.
setting.crypto.aws.region.allowed=empty (AWS SDK default region chain: AWS_REGION, profile, EC2 metadata) or a region such as ap-northeast-2
setting.crypto.aws.region.example=crypto.aws.region=ap-northeast-2

setting.crypto.aws.kms.key.id.purpose=KMS key that protects the data key (KeyId of GenerateDataKey/Encrypt/Decrypt).
setting.crypto.aws.kms.key.id.allowed=key ID, key ARN, alias/<name> or alias ARN
setting.crypto.aws.kms.key.id.notes=Decrypt is called with this KeyId, so a data key made with another KMS key is rejected. A key ARN region must match crypto.aws.region.
setting.crypto.aws.kms.key.id.example=crypto.aws.kms.key.id=alias/java-crypto-kit-prod

setting.crypto.aws.kms.data-key.file.purpose=File with the encrypted data key (Base64 CiphertextBlob) made once by kms datakey.
setting.crypto.aws.kms.data-key.file.allowed=path of a regular file (max 16KB)
setting.crypto.aws.kms.data-key.file.notes=Keep this file: the same data key is restored at every start. It is bound to crypto.key.id by the encryption context java-crypto-kit:key-id.
setting.crypto.aws.kms.data-key.file.example=crypto.aws.kms.data-key.file=/etc/java-crypto-kit/prod.datakey

setting.crypto.aws.kms.timeout.ms.purpose=Total time limit of one KMS call in milliseconds, AWS SDK standard retries included.
setting.crypto.aws.kms.timeout.ms.allowed=integer 500-120000 (default 10000)
setting.crypto.aws.kms.timeout.ms.example=crypto.aws.kms.timeout.ms=5000
