api.details.api-aes-encrypt=Format raw (default): AES-128 or AES-256 (default), up to 1 MiB in.\nFormat enc: AES-256, --key-id required, ENC limit 16 KiB.\nKey mode (default) needs --key-file or hidden key input.\nPass mode needs --pass-file or hidden passphrase and hexadecimal Salt.\nSalt: raw 16–64 bytes; enc exactly 16. KDF default PBKDF2-SHA256.\nIterations 100000–5000000; defaults 600000 (SHA256), 210000 (SHA512).\nRaw only: --aad or --aad-file (up to 64 KiB), --encoding (Base64).\nKey and pass options are mutually exclusive. Key ID is ENC only.
api.example.api-aes-encrypt=Prepare sample.txt, aes.key, and a protected UTF-8 sample.pass.\nUse the same Salt, options and encodings for decryption.\njava -jar {jar} api aes enc --fmt raw --key-file aes.key --aad member-01 --in sample.txt --out aes.b64\njava -jar {jar} api aes enc --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.b64\njava -jar {jar} api aes enc --fmt enc --key-id app-key-01 --key-file aes.key --in sample.txt --out aes.enc\njava -jar {jar} api aes enc --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.enc
api.details.api-aes-decrypt=Use the original format (raw default), AES size (256 default) and key.\nPass mode uses the same Salt and KDF/iterations as encryption.\nRaw accepts --input-encoding (Base64) and --aad or --aad-file.\nENC requires --format enc and --key-id; raw options are unavailable.\nENC limit 16 KiB; raw reads up to 2 MiB + 128 encoded bytes.\nUse --out for exact restored bytes, or --show for UTF-8 in a terminal.
api.example.api-aes-decrypt=Prepare sample.txt, aes.key, and a protected UTF-8 sample.pass.\nUse the same Salt, options and encodings for decryption.\njava -jar {jar} api aes dec --fmt raw --key-file aes.key --aad member-01 --in aes.b64 --out restored-key.txt\njava -jar {jar} api aes dec --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in pass.b64 --out restored-pass.txt\njava -jar {jar} api aes dec --fmt enc --key-id app-key-01 --key-file aes.key --in aes.enc --out restored-enc.txt\njava -jar {jar} api aes dec --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in pass.enc --out restored-enc-pass.txt
api.details.api-rsa-encrypt=RSA --public-key is required. OAEP/MGF1 SHA-256 (default) or SHA-512.\nInput maximum = modulus bytes minus twice the hash length minus 2.\nUse Hybrid for larger inputs. Output encoding defaults to Base64.
api.example.api-rsa-encrypt=java -jar {jar} api rsa enc --pub-key rsa-public.pem --in sample.txt --out rsa.b64
api.details.api-rsa-decrypt=Use the matching RSA --private-key. OAEP uses SHA-256 or SHA-512.\nDefault SHA-256 and Base64 input; decoded data must be one RSA block.\nEncoded input limit 64 KiB. Protect plaintext with --out or --show.
api.example.api-rsa-decrypt=java -jar {jar} api rsa dec --priv-key rsa-private.pem --in rsa.b64 --out restored.txt
api.details.api-hybrid-encrypt=Use RSA --public-key. The envelope uses RSA-OAEP-SHA256 and AES-256-GCM.\nPlaintext up to 64 MiB; --aad or --aad-file up to 64 KiB.\nDefault output Base64; prepare the matching private key for decryption.
api.example.api-hybrid-encrypt=java -jar {jar} api hybrid enc --pub-key rsa-public.pem --in sample.txt --out hybrid.b64
api.details.api-hybrid-decrypt=Use RSA --private-key and the same --aad or --aad-file, if supplied.\nDefault input Base64. Encoded file limit 128 MiB + 64 KiB.\nOutput is binary via --out, or UTF-8 via approved --show.
api.example.api-hybrid-decrypt=java -jar {jar} api hybrid dec --priv-key rsa-private.pem --in hybrid.b64 --out restored.txt
api.details.api-hmac-sign=Use --key-file (Base64 by default) or hidden key input. Input up to 1 MiB.\nSHA-256 (default) or SHA-512. MAC output defaults to Hex.\nKeys need 32 bytes; --external-key allows existing keys from 1 byte.
api.example.api-hmac-sign=java -jar {jar} api hmac sign --key-file hmac.key --in request.json --out request.mac
api.details.api-hmac-verify=Use the same key, input (up to 1 MiB), algorithm and MAC encoding.\nDefault SHA-256 and Hex. --expected-file supplies the saved MAC.\nKeys need 32 bytes; --external-key allows existing keys from 1 byte.
api.example.api-hmac-verify=java -jar {jar} api hmac verify --key-file hmac.key --in request.json --expected-file request.mac
api.details.api-hash-generate=SHA-256 (default) or SHA-512; default output Hex. Files are streamed.
api.example.api-hash-generate=java -jar {jar} api hash gen --in application.jar --out application.sha
api.details.api-hash-verify=Use the original hash algorithm (default SHA-256) and encoding (Hex).\n--expected-file or one-line input supplies the saved digest.
api.example.api-hash-verify=java -jar {jar} api hash verify --in application.jar --expected-file application.sha
api.details.api-encode=Default Base64. Up to 1 MiB; preserves every input file byte.
api.example.api-encode=java -jar {jar} api encode --enc base64 --in sample.bin --out sample.b64
api.details.api-decode=Default Base64. Input limit 2 MiB + 5 bytes. Use --out for binary data.
api.example.api-decode=java -jar {jar} api decode --enc base64 --in sample.b64 --out restored.bin
api.details.api-random-bytes=Default 32 bytes. Valid range 1 to 65536. Default encoding Base64.
api.example.api-random-bytes=java -jar {jar} api rand bytes --len 16 --enc hex --out salt.hex
api.details.api-random-token=Default 32 bytes (16 to 1024) in Base64URL.
api.example.api-random-token=java -jar {jar} api rand token --len 32 --out random.txt
api.details.api-random-string=Length defaults to 32, range 1–1024. Optional prefix up to 1024 chars.\nAlphabet: digits, upper, lower, letters, upper-digits, lower-digits,\nor alphanumeric (default). Use --out or approved --show.
api.example.api-random-string=java -jar {jar} api rand string --len 12 --alphabet digits --prefix TEST- --out random.txt
api.details.api-random-nonce=Base64URL output. The caller controls reuse.
api.example.api-random-nonce=java -jar {jar} api rand nonce --out nonce.txt
api.details.api-random-uuid=Returns the usual UUID text representation.
api.example.api-random-uuid=java -jar {jar} api rand uuid
api.details.api-password-hash=Use --password-file (UTF-8) or hidden input. Password max 1024 bytes.\nPBKDF2 SHA-256 default (600000); SHA-512 default 210000.\nIterations 100000–5000000; protect the result with --out or --show.
api.example.api-password-hash=java -jar {jar} api password hash --password-file app.pw --out app.hash
api.details.api-password-verify=Use --in for the stored hash and --password-file for the password.\nThe hash supplies its algorithm and iterations (1000–5000000).
api.example.api-password-verify=java -jar {jar} api password verify --password-file app.pw --in app.hash
api.details.api-password-needs-rehash=Use --in for a stored hash. Prints true/false.\nPolicy is PBKDF2 SHA-256 (600000) or SHA-512 (210000);\ncustom iteration count 100000–5000000.
api.example.api-password-needs-rehash=java -jar {jar} api password needs-rehash --in app.hash
api.details.api-kdf-pbkdf2=Use --pass-file or hidden input and --salt or --salt-file (Hex 16–64 B).\nPBKDF2 SHA-256 (600000 default) or SHA-512 (210000 default).\nIterations 100000–5000000. Output 16–64 bytes, default 32, Base64.
api.example.api-kdf-pbkdf2=java -jar {jar} api kdf pbkdf2 --pass-file sample.pass --salt-file salt.hex --out pbkdf2.key
api.details.api-kdf-hkdf=Use --key-file or hidden IKM. SHA-256 (default) or SHA-512.\nSalt and Salt file use Hex (optional). --info is UTF-8 text;\n--info-file uses original bytes. Inline and file options are exclusive.\nLength 1 to 255 times hash bytes (default 32); output Base64 by default.
api.example.api-kdf-hkdf=java -jar {jar} api kdf hkdf --key-file hmac.key --info trial --out hkdf.key
api.details.api-signature-sign=Use PKCS#8 --private-key. rsa-sha256 (default) or ecdsa-sha256 (P-256).\nEncoded signature defaults to Base64. File data is streamed.
api.example.api-signature-sign=java -jar {jar} api sig sign --priv-key rsa-private.pem --in sample.txt --out sample.sig
api.details.api-signature-verify=Use SPKI --public-key and --signature-file (64 KiB encoded limit).\nUse the signing algorithm (RSA-SHA256 default) and encoding (Base64).\nECDSA-SHA256 uses P-256 and a DER signature.
api.example.api-signature-verify=java -jar {jar} api sig verify --pub-key rsa-public.pem --in sample.txt --sig-file sample.sig
api.details.api-certificate-info=Use a PEM/DER certificate file in --in. Defaults to UTC now.\nUse --at for ISO-8601 time. Reports metadata and date validity.
api.example.api-certificate-info=java -jar {jar} api cert info --in server.crt
api.details.api-keygen=Required --type aes|hmac|rsa|ec|otp and --reason (1–200 characters).\nAES bits 128/256 (default 256); HMAC SHA-256 (default) or SHA-512.\nAES/HMAC default Base64. OTP SHA1 (default), SHA256 or SHA512;\nOTP always uses Base32 (omit --encoding or use base32).\nRSA 2048/3072/4096 (default 3072); EC P-256. Use --out prefix.\nRSA/EC write two PEM files; --encoding and --show are unavailable.
api.example.api-keygen=java -jar {jar} api keygen --type aes --bits 256 --out aes.key --reason 'AES example'\njava -jar {jar} api keygen --type hmac --out jwt.key --reason 'JWT HS256 example'\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api keygen --type ec --out ec --reason 'JWT ES256 example'\njava -jar {jar} api keygen --type otp --enc base32 --out otp.key --reason 'OTP enrollment example'
api.details.api-keyconvert=Required type, output format, input and output. PEM or DER input.\nSPKI public and PKCS#8 private keys; choose pem or der.
api.example.api-keyconvert=java -jar {jar} api keyconv --type public --fmt der --in rsa-public.pem --out rsa.der
api.details.api-jwt-create=Choose --algorithm hs256|rs256|es256. Lifetime defaults to 300 s (min 1).\nHS256: --key-file (at least 32 B). RSA/EC: --private-key (RSA 2048+\nbits or P-256). Do not mix private key and shared-key options.\nOptional --claims-file (JSON, 64 KiB), --kid and ISO-8601 times.\nReserved claims use dedicated options. Output compact JWT up to 64 KiB.\nUse --out or approved --show for the token.\nThe final claims object, including iat and exp, has up to 1,000 members.
api.example.api-jwt-create=Prepare claims.json and expected.json (e.g. {"department":"dev"}).\nThe trusted JWKS must contain the RSA public key with kid rsa-demo.\njava -jar {jar} api jwt create --alg hs256 --key-file jwt.key --iss test-app --sub user01 --aud test-api --out jwt-hs.txt\njava -jar {jar} api jwt create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --kid rsa-demo --claims-file claims.json --out jwt-rs.txt\njava -jar {jar} api jwt create --alg es256 --priv-key ec-private.pem --iss test-app --sub user01 --aud test-api --out jwt-es.txt
api.details.api-jwt-inspect=Supply --in (compact JWT, up to 64 KiB) or use hidden token input.\nUse --out or --show for the unverified header and claims.\nOutput is a warning and labeled header/payload text (.txt).
api.example.api-jwt-inspect=java -jar {jar} api jwt inspect --in jwt-hs.txt --out jwt-review.txt
api.details.api-jwt-verify=Choose --algorithm hs256|rs256|es256 and --audience or --any-audience.\nHS256: --key-file (at least 32 B). RSA/EC: --public-key or --jwks-file.\nKey input sources are mutually exclusive. JWKS JSON limit 1 MiB.\n--in compact JWT up to 64 KiB; exp required, skew 0–300 s (default 0).\nUse --require-claims for names and a JSON string map for exact values.
api.example.api-jwt-verify=Prepare claims.json and expected.json (e.g. {"department":"dev"}).\nThe trusted JWKS must contain the RSA public key with kid rsa-demo.\njava -jar {jar} api jwt verify --alg hs256 --key-file jwt.key --iss test-app --aud test-api --in jwt-hs.txt\njava -jar {jar} api jwt verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --require-claims department --require-claim-values-file expected.json --in jwt-rs.txt\njava -jar {jar} api jwt verify --alg es256 --pub-key ec-public.pem --iss test-app --aud test-api --in jwt-es.txt\njava -jar {jar} api jwt verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --in jwt-rs.txt
api.details.api-oauth-token=Required HTTPS --endpoint, --client-id and secret file or hidden input.\nBasic default; --auth-method post requires server support.\nConnect 1–60 s (5), read 1–120 s (10), response 1 KiB–1 MiB (64 KiB).\nUse --out or --show. For introspection the issued token must fit 16 KiB\nfor ASCII (16384 characters); oversized tokens are saved with a notice.\nA malformed response scope fails with INVALID_RESPONSE.
api.example.api-oauth-token=java -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method basic --out remote-basic.txt\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method post --scope read --out remote-post.txt
api.details.api-oauth-introspect=Basic only. Required HTTPS --endpoint, --client-id and secret input.\n--in takes an access token up to 16384 chars (16 KiB for ASCII).\nConnect 1–60 s (5), read 1–120 s (10), response 1 KiB–1 MiB (64 KiB).\n--token-type-hint is optional (1–64 ASCII letters, digits, underscores).\nUse --out or --show. active:false is a successful server response.\nA malformed scope on an active response fails with INVALID_RESPONSE.
api.example.api-oauth-introspect=java -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-basic.txt --out status-basic.json\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-post.txt --token-type-hint access_token --out status-post.json
api.details.api-oauth-create=Local RFC 9068 only. Require --issuer, --subject, --audience, --client-id.\n--algorithm hs256|rs256|es256 with --key-file OR --private-key.\nHS256 needs 32 B or more. RSA 2048+ bits; EC P-256.\nLifetime defaults to 300 s. Optional --scope, --roles and claims JSON\n(string, integer or boolean values). Save compact JWT up to 64 KiB.\nSubject, client ID and jti cannot be blank or contain controls.
api.example.api-oauth-create=Replace the HTTPS example URLs, client values and policy with your provider\nsettings.\nProtect client.pw.\nFor local JWKS verification use the RSA public key with kid rsa-demo.\nSupply the provider token and JWKS for the profile variant.\njava -jar {jar} api oauth create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --client-id test-app --kid rsa-demo --scope read --out access-local.txt
api.details.api-oauth-verify=Local verification. Require --issuer, --audience and --algorithm.\nHS256 needs --key-file (32 B or more). RSA/EC need --public-key or JWKS.\n--in JWT limit 64 KiB; clock skew 0–300 s (default 0).\nRFC 9068 is default; fixed type and claim names. --profile profile\nneeds an access-token discriminator such as a dedicated --typ or scope.\nRequired identifiers cannot be blank or contain control characters.
api.example.api-oauth-verify=Replace the HTTPS example URLs, client values and policy with your provider\nsettings.\nProtect client.pw.\nFor local JWKS verification use the RSA public key with kid rsa-demo.\nSupply the provider token and JWKS for the profile variant.\njava -jar {jar} api oauth verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --profile profile --alg rs256 --jwks-file provider-jwks.json --iss https://auth.example.com --aud test-api --typ at+jwt --scope read --in provider-access.txt
api.details.api-otp-generate=Base32 --key-file (decoded secret 16 B or more) or hidden input.\nTOTP default SHA1, period 30 s (15–300); SHA256 and SHA512 allowed.\nHOTP requires --counter and SHA1; excludes --period and --at.\n--digits 6–8 (default 6). Use --out or --show for the code.
api.example.api-otp-generate=Use the same fixed UTC time for a repeatable test. Omit --at for live TOTP.\njava -jar {jar} api otp gen --type totp --key-file otp.key --at 2026-11-26T00:00:00Z --out otp-code.txt
api.details.api-otp-verify=Use the same Base32 --key-file, type, digits, algorithm and period.\nDefault TOTP/SHA1/6 digits/30 s; HOTP is counter-based and SHA1 only.\nWindow default 0. HOTP 0–100 ahead; TOTP 0–10 steps on either side.
api.example.api-otp-verify=Use the same fixed UTC time for a repeatable test. Omit --at for live TOTP.\njava -jar {jar} api otp verify --type totp --key-file otp.key --at 2026-11-26T00:00:00Z --in otp-code.txt
api.details.api-otp-uri=TOTP only. Base32 --key-file, --issuer and --account required.\nSHA1 (default), SHA256 or SHA512; 6–8 digits (default 6).\nPeriod 15–300 s (default 30). Use --out or --show; URI contains secret.
api.example.api-otp-uri=java -jar {jar} api otp uri --type totp --key-file otp.key --issuer TestApp --account user01 --out otp-uri.txt
api.details.api-request-auth-sign=Default HMAC SHA-256; SHA-512 also supported. Shared key >=32 B.\nRequest bytes up to 1 MiB; --at fixes the clock in Unix seconds.\nNonce is generated automatically. Save the three-field JSON with --out.
api.example.api-request-auth-sign=java -jar {jar} api req-auth sign --key-file hmac.key --in request.json --out request.sig.json
api.details.api-request-auth-verify=Use the same key, algorithm (default SHA-256) and request (up to 1 MiB).\nUse --auth-file OR all of --timestamp, --nonce and --mac.\n--at fixes Unix seconds. Skew 1–900 s (default 300); caller owns replay.
api.example.api-request-auth-verify=java -jar {jar} api req-auth verify --key-file hmac.key --in request.json --auth-file request.sig.json
api.flow.aes=Prepare sample.txt and a protected UTF-8 sample.pass.\nThe commands create a key and Salt.\n\n1. Raw AES key and AAD\njava -jar {jar} api keygen --type aes --bits 256 --out aes.key --reason 'AES example'\njava -jar {jar} api aes enc --fmt raw --key-file aes.key --aad member-01 --in sample.txt --out aes.b64\njava -jar {jar} api aes dec --fmt raw --key-file aes.key --aad member-01 --in aes.b64 --out restored-key.txt\n\n2. Raw passphrase and Hex Salt\njava -jar {jar} api rand bytes --len 16 --enc hex --out salt.hex\njava -jar {jar} api aes enc --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.b64\njava -jar {jar} api aes dec --fmt raw --type pass --pass-file sample.pass --salt-file salt.hex --in pass.b64 --out restored-pass.txt\n\n3. ENC with a key ID (key and passphrase)\njava -jar {jar} api aes enc --fmt enc --key-id app-key-01 --key-file aes.key --in sample.txt --out aes.enc\njava -jar {jar} api aes dec --fmt enc --key-id app-key-01 --key-file aes.key --in aes.enc --out restored-enc.txt\njava -jar {jar} api aes enc --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in sample.txt --out pass.enc\njava -jar {jar} api aes dec --fmt enc --type pass --key-id app-pass-01 --pass-file sample.pass --salt-file salt.hex --in pass.enc --out restored-enc-pass.txt\nCompare the restored files with sample.txt.
api.flow.rsa=java -jar {jar} api keygen --type rsa --out rsa --reason 'RSA interop'\njava -jar {jar} api rsa enc --pub-key rsa-public.pem --in sample.txt --out rsa.b64\njava -jar {jar} api rsa dec --priv-key rsa-private.pem --in rsa.b64 --out restored.txt
api.flow.hybrid=java -jar {jar} api keygen --type rsa --out rsa --reason 'Hybrid interop'\njava -jar {jar} api hybrid enc --pub-key rsa-public.pem --in sample.txt --out hybrid.b64\njava -jar {jar} api hybrid dec --priv-key rsa-private.pem --in hybrid.b64 --out restored.txt
api.flow.hmac=java -jar {jar} api keygen --type hmac --out hmac.key --reason 'HMAC interop'\njava -jar {jar} api hmac sign --key-file hmac.key --in request.json --out request.mac\njava -jar {jar} api hmac verify --key-file hmac.key --in request.json --expected-file request.mac
api.flow.signature=java -jar {jar} api keygen --type ec --out ec --reason 'signature test'\njava -jar {jar} api sig sign --alg ecdsa-sha256 --priv-key ec-private.pem --in sample.txt --out sample.sig\njava -jar {jar} api sig verify --alg ecdsa-sha256 --pub-key ec-public.pem --in sample.txt --sig-file sample.sig
api.flow.jwt=Install your trusted JWKS locally.\nFor the RSA example include the generated rsa-public.pem public key in that\nJWKS, with kid rsa-demo.\nPrepare claims.json and expected.json, e.g. {"department":"dev"}.\n\n1. HS256 shared key, inspect and verify\njava -jar {jar} api keygen --type hmac --out jwt.key --reason 'JWT HS256 example'\njava -jar {jar} api jwt create --alg hs256 --key-file jwt.key --iss test-app --sub user01 --aud test-api --out jwt-hs.txt\njava -jar {jar} api jwt inspect --in jwt-hs.txt --out jwt-review.txt\njava -jar {jar} api jwt verify --alg hs256 --key-file jwt.key --iss test-app --aud test-api --in jwt-hs.txt\n\n2. RS256 with application claims and local JWKS\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api jwt create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --kid rsa-demo --claims-file claims.json --out jwt-rs.txt\njava -jar {jar} api jwt verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --require-claims department --require-claim-values-file expected.json --in jwt-rs.txt\njava -jar {jar} api jwt verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --in jwt-rs.txt\n\n3. ES256 with a P-256 key pair\njava -jar {jar} api keygen --type ec --out ec --reason 'JWT ES256 example'\njava -jar {jar} api jwt create --alg es256 --priv-key ec-private.pem --iss test-app --sub user01 --aud test-api --out jwt-es.txt\njava -jar {jar} api jwt verify --alg es256 --pub-key ec-public.pem --iss test-app --aud test-api --in jwt-es.txt\nSuccessful verification prints OK.
api.flow.oauth=Replace the example URLs and prepare protected client.pw with authorized\ncredentials.\nThe introspection client must support Basic.\nThe local JWKS needs the generated RSA public key with kid rsa-demo.\nThe profile example needs the provider token and its trusted JWKS.\n\n1. Remote HTTPS token and introspection\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method basic --out remote-basic.txt\njava -jar {jar} api oauth token --endpoint https://auth.example.com/token --client-id test-app --client-secret-file client.pw --auth-method post --scope read --out remote-post.txt\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-basic.txt --out status-basic.json\njava -jar {jar} api oauth introspect --endpoint https://auth.example.com/introspect --client-id test-app --client-secret-file client.pw --in remote-post.txt --token-type-hint access_token --out status-post.json\n\n2. Local RFC 9068 creation and verification\njava -jar {jar} api keygen --type rsa --bits 2048 --out rsa --reason 'JWT RS256 example'\njava -jar {jar} api oauth create --alg rs256 --priv-key rsa-private.pem --iss test-app --sub user01 --aud test-api --client-id test-app --kid rsa-demo --scope read --out access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --pub-key rsa-public.pem --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\njava -jar {jar} api oauth verify --alg rs256 --jwks-file trusted-jwks.json --iss test-app --aud test-api --kid rsa-demo --scope read --in access-local.txt\n\n3. Local profile verification with the provider token and JWKS\njava -jar {jar} api oauth verify --profile profile --alg rs256 --jwks-file provider-jwks.json --iss https://auth.example.com --aud test-api --typ at+jwt --scope read --in provider-access.txt\nSuccessful verification prints OK.
api.flow.otp=The fixed UTC time below is for a repeatable test. Omit --at for live TOTP.\njava -jar {jar} api keygen --type otp --out otp.key --reason 'OTP test'\njava -jar {jar} api otp uri --type totp --key-file otp.key --issuer TestApp --account user01 --out otp-uri.txt\njava -jar {jar} api otp gen --key-file otp.key --at 2026-11-26T00:00:00Z --out otp-code.txt\njava -jar {jar} api otp verify --key-file otp.key --at 2026-11-26T00:00:00Z --in otp-code.txt
api.flow.request-auth=java -jar {jar} api keygen --type hmac --out hmac.key --reason 'request test'\njava -jar {jar} api req-auth sign --key-file hmac.key --in request.json --out request.sig.json\njava -jar {jar} api req-auth verify --key-file hmac.key --in request.json --auth-file request.sig.json
