# java-crypto-kit CLI messages (English, default bundle). UTF-8. Korean: cli_ko.properties (same keys, checked by tests).
# Placeholders {0},{1},... receive only safe values (names, counts, file names). Never secrets or user input.
# Output rule: normal results show only the result (no advice or next-step text); errors show the cause and what to check.
# Operational and security notes belong in the user guide. Labels of query screens are padded so the values line up.

