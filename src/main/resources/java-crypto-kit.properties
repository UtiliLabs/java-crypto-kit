# ============================================================================
# java-crypto-kit built-in settings (inside the JAR, shared by CLI, Java API, Tomcat Factory)
# java-crypto-kit JAR 내장 설정 (CLI·Java API·Tomcat Factory 공통)
# ============================================================================
# UTF-8. Full reference with defaults, allowed values and examples:  java -jar <jar> config help
# UTF-8. 기본값·허용값·예제 전체 설명:                               java -jar <jar> config help
#
# Change these values without rebuilding:  java -jar <jar> config set <name>=<value> --operator <ID>
#   (creates a new JAR by default; --replace backs up and replaces). View: config show / config history
# 재빌드 없이 변경: config set <이름>=<값> --operator <ID> (기본은 새 JAR 생성, --replace는 백업 후 교체)
#   조회: config show(현재 값) / config history(전체 변경 이력)
#
# Priority (highest first) / 우선순위(높은 것이 이김):
#   1) JVM property -Dcrypto.* (only when crypto.jvm.override.enabled=true; not for crypto.key.embedded)
#   2) external Properties file: -Dcrypto.config.file=<path> or env CRYPTO_CONFIG_FILE=<path> (CLI: --config)
#   3) these JAR built-in values
#   Unknown names in the external file, and typos of -Dcrypto.* names of this library, stop with an error.
#   외부 파일의 모르는 이름과 이 라이브러리 -Dcrypto.* 이름의 오타는 오류로 중단한다(공개 키로 조용히 동작하지 않게).
# A specified but missing/empty/broken external config stops with an error (never falls back to the built-in key).
# 지정한 외부 설정이 없거나 비어 있거나 깨졌으면 오류로 중단한다(내장 키로 바꾸지 않음).
# Settings are read once when a DataSource/CLI command starts. Restart WAS after changing them.
# 설정은 DataSource 생성·CLI 실행 때 한 번 읽는다. 바꾼 뒤 WAS를 다시 시작한다.
#
# WARNING: the default built-in key below is a PUBLIC example key published with the source. Anyone can decrypt
# ciphertext made with it. Before production use, embed your own key (config embed-key) or use file/env/vault/aws-kms.
# 주의: 아래 기본 내장 키는 공개 예제 키다(누구나 복호화 가능). 운영 전에 사용자 지정 키(config embed-key)나 외부 키를 쓴다.
# ============================================================================

# [Message language / 메시지 언어]  default ko | allowed ko, en, auto  | -D: allowed
# Language of all messages made by this library (CLI, Java API exceptions, Tomcat Factory logs, Vault/KMS errors).
# ko = Korean (default), en = English, auto = JVM locale (Korean -> ko, anything else -> en).
# CLI --lang en|ko overrides it for one run only.
# 라이브러리 메시지 전체의 언어. 기본 ko(한국어), en(영어), auto(JVM Locale: 한국어면 ko, 그 밖에는 en). CLI --lang은 한 번만 적용.
crypto.lang=ko

# [Key source / 키 공급 방식]  default embedded | allowed embedded, file, env, vault, aws-kms | -D: allowed
# embedded: key in this JAR (extractable). file: crypto.key.file. env: crypto.key.env. vault: Vault KV v2. aws-kms: KMS data key.
# A selected external key that cannot be read stops with an error (no fallback to the built-in key).
# 외부 키를 골랐는데 읽지 못하면 내장 키로 바꾸지 않고 실패한다. 키 파일·환경변수·Vault·KMS 설정이 있으면 이 항목도 반드시 적는다.
crypto.key.source=embedded

# [Key ID / 키 식별자]  default default | allowed [A-Za-z0-9_-]{1,64} | -D: allowed
# Written into every ciphertext (ENC[v1:<key ID>:...]). Use a new key ID for a new key (e.g. prod01). Not a key itself.
# 모든 암호문에 기록되는 이름(실제 키 아님). 새 키에는 새 키ID를 쓴다. 바꾸면 기존 암호문은 rekey로 다시 암호화한다.
crypto.key.id=default

# [Key file / 키 파일 경로]  default (empty) | used when crypto.key.source=file | -D: allowed
# One line of standard Base64 (made by keygen). Use / in Windows paths (C:/secure/crypto.key). Restrict read access.
# keygen으로 만든 Base64 한 줄 파일. Windows 경로도 / 로 쓴다. WAS 계정만 읽도록 권한을 제한한다.
crypto.key.file=

# [Key environment variable / 키 환경변수 이름]  default CRYPTO_KEY | used when crypto.key.source=env | -D: allowed
# Name of the variable only (the value is the Base64 key). The variable must reach the WAS service process.
# 변수 "이름"만 적는다(값은 Base64 키). WAS 서비스 프로세스에 전달되어야 한다.
crypto.key.env=CRYPTO_KEY

# [Built-in key / 내장 키]  secret, never printed | used when crypto.key.source=embedded | -D: REJECTED
# Change only with: config embed-key --from-file <key file> --key-id <new ID> --operator <ID>  (not with config set).
# Exactly 32 random bytes in standard Base64. Changing it makes ciphertext of the old key undecryptable with this JAR.
# 변경은 config embed-key로만 한다(config set 불가). 바꾸면 이전 키의 암호문은 이 JAR로 복호화되지 않는다.
# -D is rejected (process lists and startup logs would expose the key). 아래는 공개 예제 키(비밀 아님)다.
crypto.key.embedded=s0gzKqI+NszbLiZTEq+EUlP84iv1RSn9u6QMVEs29Q4=

# [Algorithm / 알고리즘]  fixed AES/GCM/NoPadding (AES-256, 12-byte random IV, 128-bit tag) | -D: allowed (same value only)
# Kept for explicitness; any other value is rejected. 다른 값은 거부한다(약한 방식으로 바꿀 수 없음).
crypto.algorithm=AES/GCM/NoPadding

# [Warning messages / 안내 경고]  default true | allowed true, false | -D: allowed
# false hides only the non-blocking key-risk WARNINGs (public key, extractable built-in key). Errors are never hidden,
# and the risk itself does not go away. false는 안내 WARNING만 끈다(오류·검증은 그대로, 위험이 사라지지 않음).
crypto.warning.enabled=true

# [Ciphertext output / 암호문 출력 형식]  default enc | allowed enc, base64 | -D: allowed
# base64 wraps ENC[...] once more as B64[...] (encoding only, not extra security). Decryption accepts both.
# base64는 ENC[...]를 B64[...]로 한 번 더 감싸는 표현일 뿐이다. 복호화는 두 형식을 모두 받는다.
crypto.output.encoding=enc

# [JVM override policy / JVM -D 덮어쓰기 정책]  default true | allowed true, false | -D: ignored (cannot be bypassed)
# false ignores all -Dcrypto.* settings (the -Dcrypto.config.file path option still works). Not an absolute security
# boundary: whoever controls the WAS options or config files can still change settings.
# false면 -Dcrypto.* 개별 설정을 모두 무시한다(-Dcrypto.config.file은 동작). 절대적 보안 경계는 아니다.
crypto.jvm.override.enabled=true

# [Tomcat pool factory / Tomcat Pool Factory]  default DBCP2 | allowed the two official Tomcat factories | -D: allowed
# The Resource factory attribute is always io.javacryptokit.jdbc.tomcat.EncryptedDataSourceFactory (not this value).
# Resource의 factory 속성에는 항상 io.javacryptokit.jdbc.tomcat.EncryptedDataSourceFactory를 쓴다(이 값 아님).
# Effect: applies to every Resource of the Tomcat JVM. Use separate Tomcat instances if Resources need different pools.
# 변경 영향: 한 Tomcat JVM의 모든 Resource에 공통으로 적용된다. Resource마다 다른 Pool이 필요하면 Tomcat 인스턴스를 나눈다.
crypto.pool.factory=org.apache.tomcat.dbcp.dbcp2.BasicDataSourceFactory

# [Plain password rejection / 평문 비밀번호 거부]  fixed true | -D: allowed (true only)
# A Resource password that is not ENC[...]/B64[...] stops the DataSource. 평문 password는 DataSource 생성을 중단한다.
crypto.require.encrypted.password=true

# ---------------------------------------------------------------------------
# HashiCorp Vault KV v2 (crypto.key.source=vault). Details: java -jar <jar> help vault
# The token itself is never stored here: only the token environment variable name or token file path.
# 토큰 원문은 여기에 두지 않는다(토큰 환경변수 이름 또는 토큰 파일 경로만).
# ---------------------------------------------------------------------------
# Vault address, https://host[:port] only (TLS and host name are always verified). Vault 주소(https만).
crypto.vault.url=
# KV v2 mount path (e.g. secret). KV v2 마운트 경로.
crypto.vault.mount=secret
# Secret path under the mount (e.g. java-crypto-kit/prod). 마운트 아래 Secret 경로.
crypto.vault.path=
# Field of the secret that holds the Base64 AES-256 key. 키(Base64)가 들어 있는 필드 이름.
crypto.vault.field=key
# Secret version to read. Empty = latest (pinning a version is recommended). 읽을 버전(비우면 최신, 고정 권장).
crypto.vault.ver=
# Environment variable that holds the Vault token (used when crypto.vault.token.file is empty). 토큰 환경변수 이름.
crypto.vault.token.env=VAULT_TOKEN
# Token file path (takes precedence over crypto.vault.token.env when set). 토큰 파일 경로(지정하면 우선).
crypto.vault.token.file=
# PEM CA file to trust for Vault (empty = JVM default trust store). Vault 서버 인증서를 검증할 CA PEM 파일.
crypto.vault.ca.file=
# Connect and read time limit per attempt in ms (100-60000; up to 3 attempts for temporary failures). 시도당 제한 시간.
crypto.vault.timeout.ms=5000

# ---------------------------------------------------------------------------
# AWS KMS envelope encryption (crypto.key.source=aws-kms). Details: java -jar <jar> help aws-kms
# Needs the optional AWS SDK bundle (java-crypto-kit-aws-kms-lib-<version>.zip). AWS credentials are never stored
# here: the AWS SDK standard credential chain is used (IAM role, profile, environment variables).
# 선택 설치 SDK 묶음이 필요하다. AWS 자격증명은 여기에 두지 않는다(SDK 표준 자격증명 체계).
# ---------------------------------------------------------------------------
# AWS region (empty = AWS SDK default region chain, e.g. AWS_REGION). AWS 리전(비우면 SDK 기본값).
crypto.aws.region=
# KMS key ID, key ARN, alias/name or alias ARN that protects the data key. 데이터 키를 보호하는 KMS 키.
crypto.aws.kms.key.id=
# File with the encrypted data key (Base64 CiphertextBlob, made once by kms datakey). 암호화된 데이터 키 파일.
crypto.aws.kms.data-key.file=
# Total time limit of one KMS call in ms, retries included (500-120000). KMS 호출 전체 제한 시간.
crypto.aws.kms.timeout.ms=10000
