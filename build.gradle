plugins {
    // WAS에 종속되지 않는 일반 Java 라이브러리 JAR(실행 가능한 CLI 포함)다. 웹 애플리케이션이 아니다.
    id 'java'
}

// 기본 Java 패키지(io.javacryptokit)와 같은 group을 쓴다.
group = 'io.javacryptokit'
version = '0.2.0'

java {
    // 빌드 실행 JDK: Gradle 8.14.8 공식 지원 범위인 JDK 8~24(JDK 25 이상은 Gradle 9.1 이상 필요, 이번 범위에서 업그레이드 안 함).
    // 생성되는 JAR는 어떤 빌드 JDK에서든 Java 8 클래스 규격(major 52)이다.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    // 테스트 전용 JUnit 5를 내려받는 저장소. 배포 JAR에는 어떤 외부 라이브러리도 들어가지 않는다.
    mavenCentral()
}

// [선택 기능: AWS KMS] AWS SDK for Java 2.x(Apache-2.0, Java 8 지원). 1.x는 지원 종료되어 쓰지 않는다.
// 보안 업데이트가 나오면 이 버전만 올리고 clean build로 다시 검증한다(KMS 묶음 ZIP이 같은 버전으로 다시 만들어진다).
def awsSdkVersion = '2.57.10'

configurations {
    // KMS 사용자만 추가로 설치하는 SDK 런타임 JAR 목록. 기본 JAR(java-crypto-kit-<버전>.jar)에는 들어가지 않는다.
    awsKmsRuntime
}

// 서비스 모듈이 기본으로 끌어오는 무거운 HTTP 클라이언트(Apache HttpClient 4·5, Netty)는 쓰지 않는다.
// 이 라이브러리는 경량 url-connection-client(JDK HttpURLConnection 기반)를 명시적으로 사용한다.
// HTTP 클라이언트 구현을 하나만 두어야 SDK가 내부에서 직접 만드는 클라이언트(예: 기본 자격증명 체계의 STS 웹 ID·역할 전환)도
// 같은 클라이언트를 고른다(구현이 둘 이상이면 SDK가 "Multiple HTTP implementations" 오류를 낸다).
configurations.matching { it.name in ['awsKmsRuntime', 'testRuntimeClasspath', 'testCompileClasspath', 'compileClasspath'] }.configureEach {
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
    exclude group: 'software.amazon.awssdk', module: 'apache5-client'
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
}

dependencies {
    // [컴파일 전용] AWS KMS 어댑터(io.javacryptokit.key.aws) 컴파일에만 쓰고 기본 JAR에 넣지 않는다.
    // embedded/file/env/vault와 Tomcat JDBC Pool 사용자는 SDK 없이 JAR 하나로 동작한다.
    compileOnly platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    compileOnly 'software.amazon.awssdk:kms'
    compileOnly 'software.amazon.awssdk:url-connection-client'

    // [KMS 사용자용 묶음] kms + url-connection-client + sts(EKS IRSA 웹 ID 자격증명에 필요). 필요한 최소 모듈만 둔다.
    awsKmsRuntime platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    awsKmsRuntime 'software.amazon.awssdk:kms'
    awsKmsRuntime 'software.amazon.awssdk:url-connection-client'
    awsKmsRuntime 'software.amazon.awssdk:sts'

    // [테스트 전용] JUnit 5.x는 Java 8을 지원한다(JUnit 6은 Java 17 이상이 필요해 사용하지 않는다).
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // [테스트 전용] 모의 KMS 서버로 AWS KMS 어댑터를 시험한다(실제 AWS 호출 없음).
    testImplementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    testImplementation 'software.amazon.awssdk:kms'
    testImplementation 'software.amazon.awssdk:url-connection-client'
    // Gradle 9부터는 JUnit Platform Launcher를 직접 선언해야 한다(자동 로딩 제거에 대비).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // OS의 로캘과 무관하게 한글 주석/오류 메시지를 UTF-8로 컴파일한다.
    options.encoding = 'UTF-8'
    // --release 옵션은 JDK 10 이상에서만 사용 가능하다.
    // JDK 8에서는 -source 8 / -target 8을 사용하여 정상 빌드한다.
    // JDK 10 이상에서는 --release 8로 Java 8 표준 API까지 제한한다.
    if (JavaVersion.current().isCompatibleWith(JavaVersion.toVersion(10))) {
        options.release = 8
    }
    // JDK 21 이상은 --release 8에 "source/target value 8 is obsolete" 경고를 출력한다.
    // Java 8 대상 빌드는 의도된 정책이므로 이 옵션 관련 경고만 끈다(-Xlint:-options는 JDK 8 javac도 지원).
    options.compilerArgs << '-Xlint:-options'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    // [한글 깨짐(占쏙옙) 방지]
    // JDK 18 이상 자식 JVM은 표준 출력이 파이프일 때 OS 기본 인코딩(한국어 Windows는 MS949)으로 쓰는데,
    // Gradle 데몬(gradle.properties의 -Dfile.encoding=UTF-8)은 이를 UTF-8로 읽어 U+FFFD(화면에서는 占쏙옙)로 깨진다.
    // JDK 18 이상에서는 file.encoding으로 표준 출력 인코딩이 바뀌지 않으므로 표준 출력/오류 인코딩을 직접 UTF-8로 맞춘다.
    // stdout.encoding은 JDK 19 이상, sun.stdout.encoding은 JDK 18 이하가 사용하며, 모르는 속성은 JVM이 무시한다.
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
}

// JAR 내장 설정 파일의 지문(SHA-256 앞 16자). config show/history가 "이력 없이 설정이 바뀐 JAR"를 판별하는 기준이다.
// (ConfigHistory.fingerprint와 같은 계산: 파일 바이트 전체의 SHA-256)
def builtInSettingsFile = file('src/main/resources/java-crypto-kit.properties')
def builtInSettingsFingerprint = 'sha256:' + java.security.MessageDigest.getInstance('SHA-256')
        .digest(builtInSettingsFile.bytes).encodeHex().toString().substring(0, 16)

jar {
    archiveBaseName = 'java-crypto-kit'
    manifest {
        attributes(
            // java -jar 로 실행되는 CLI(io.javacryptokit.cli.CryptoCli).
            'Main-Class': 'io.javacryptokit.cli.CryptoCli',
            'Implementation-Title': 'java-crypto-kit',
            'Implementation-URL': 'https://github.com/UtiliLabs/java-crypto-kit',
            'Implementation-Version': project.version,
            'Built-For-Java': '8+',
            // 최초 빌드 일시(UTC). config show/history에 "최초 빌드 일시"로 표시된다.
            'Build-Time': java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString(),
            'Settings-Fingerprint': builtInSettingsFingerprint
        )
    }
}

// env 키 모드 시험용 더미 키: 빌드할 때마다 새 난수로 만들며 출력하거나 저장하지 않는다(실제 키가 아님).
def testEnvKeyBytes = new byte[32]
new java.security.SecureRandom().nextBytes(testEnvKeyBytes)
def testEnvKey = java.util.Base64.encoder.encodeToString(testEnvKeyBytes)
// 공개 기본 키를 env로 공급했을 때의 경고 탐지 시험용. 공개 저장소에 있는 비밀이 아닌 값이다.
def jarDefaults = new Properties()
file('src/main/resources/java-crypto-kit.properties').withReader('UTF-8') { jarDefaults.load(it) }

tasks.named('test') {
    // 표준 Gradle 테스트: JUnit 5(JUnit Platform)로 실행한다.
    // Docker 실서버 통합 시험(src/test/integration/run-tomcat-integration.sh)은 Java 테스트가 아니므로 여기서 실행하지 않는다
    // (Docker를 기본 빌드에 강제하지 않음). Tomcat Factory·키·Pool 변경과 Release 전에 bash로 따로 실행한다.
    useJUnitPlatform()
    environment 'JAVA_CRYPTO_KIT_TEST_KEY', testEnvKey
    // JAR 원본의 내장 키 값은 obf1(경량 난독화) 표현이다. 외부 공급원(env)은 표준 Base64만 받으므로, 컴파일한 코덱으로 되돌린
    // 공개 기본 키(공개 값)를 넣는다(값을 이 파일에 따로 적지 않고 설정 원본 하나를 기준으로 둔다).
    doFirst {
        def urls = sourceSets.main.output.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)
        try {
            def codec = loader.loadClass('io.javacryptokit.config.LightObfuscation')
            byte[] publicKey = codec.getMethod('decode', String).invoke(null, jarDefaults.getProperty('crypto.key.embedded').trim())
            environment 'JAVA_CRYPTO_KIT_TEST_PUBLIC_KEY', java.util.Base64.encoder.encodeToString(publicKey)
        } finally {
            loader.close()
        }
    }
    systemProperty 'file.encoding', 'UTF-8'
    // 메시지 언어 기본값은 crypto.lang=ko다. crypto.lang=auto(JVM Locale을 따름)를 쓰는 시험도 OS와 관계없이 같은 결과가 되도록
    // 테스트 JVM의 기본 Locale을 한국어로 고정한다. 영어·Locale 자동 선택·미지원 Locale 폴백은 별도 테스트가 언어를 직접 지정해 검증한다.
    systemProperty 'user.language', 'ko'
    systemProperty 'user.country', 'KR'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
    testLogging {
        // 실패한 테스트의 이름과 검증 메시지만 보여 준다(테스트 값은 모두 더미이며 메시지에 비밀값을 넣지 않는다).
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// JUnit 등 외부 라이브러리 없이 실행할 수 있는 독립 자체 검증 프로그램이다(check·build에 포함).
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'AES-GCM, 키 분리, JNDI Factory 위임, 실패 케이스를 자체 검증'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.javacryptokit.CryptoSelfTest'
    systemProperty 'user.language', 'ko'
    systemProperty 'user.country', 'KR'
}

tasks.named('check') {
    dependsOn tasks.named('selfTest')
}

// [선택 기능: AWS KMS] KMS 사용자에게만 필요한 AWS SDK 2.x JAR 묶음을 자동으로 만든다(build/distributions).
// 이 라이브러리 클래스는 들어가지 않으며(기본 JAR와 별도), Tomcat이면 CATALINA_BASE/lib에 기본 JAR와 함께 풀어 둔다.
tasks.register('awsKmsLibZip', Zip) {
    group = 'distribution'
    description = '[선택] AWS KMS 사용자용 AWS SDK 2.x 런타임 JAR 묶음'
    archiveFileName = "java-crypto-kit-aws-kms-lib-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(configurations.awsKmsRuntime) {
        into 'aws-kms-lib'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('awsKmsLibZip')
}
