# java-crypto-kit 외부 설정 예시(UTF-8로 저장) - 선택 사항이다. JAR 하나만 쓰는 기본 사용에는 이 파일이 필요 없다.
# 전체 설정 이름·기본값·허용값·예제: java -jar java-crypto-kit-0.1.0.jar config help
#
# 사용 방법
#   1) 이 예제(docs/config/java-crypto-kit.example.properties)를 저장소 밖의 접근 제한된 위치로 복사해 필요한 항목만 남긴다
#      (Tomcat lib·웹 애플리케이션 안·Git 저장소에는 두지 않는다. 파일 이름은 자유).
#        Windows 예: C:/secure/java-crypto-kit/app.properties     Linux 예: /etc/java-crypto-kit/app.properties
#   2) CLI와 WAS가 같은 파일을 쓰게 지정한다(JAR 재빌드 불필요).
#        CLI    : java -jar java-crypto-kit-0.1.0.jar encrypt --config <이 파일>
#        Tomcat : CATALINA_OPTS에 -Dcrypto.config.file=<이 파일>  또는 환경변수 CRYPTO_CONFIG_FILE=<이 파일>
#   3) 키 값·Vault 토큰·AWS 자격증명은 이 파일에 적지 않는다(키 파일·환경변수·토큰 파일·SDK 표준 자격증명 사용).
#
# 우선순위: JVM 개별 속성(-Dcrypto.*) > 이 파일 > JAR 내장 값(config set으로 바꾼 값 포함)
#   - 적은 항목만 JAR 값을 덮어쓴다. 모르는 항목 이름(오타)이 있으면 실행을 거부한다.
#   - 키 파일·키 환경변수·Vault·AWS KMS 설정을 적을 때는 crypto.key.source도 반드시 적는다.
#   - 지정한 파일이 없거나 깨졌거나 외부 키를 읽지 못하면 내장 키로 바꾸지 않고 실패한다(Fail Closed).
#   - Windows 경로는 C:/secure/... 처럼 / 로 쓴다(역슬래시는 이스케이프 문자).
#   - 실행 중인 WAS에는 자동 반영되지 않는다. 바꾸면 WAS를 다시 시작한다.

# 주의: 아래 예 1의 file 키와 Linux 경로가 현재 활성 상태다. 이 파일을 그대로 복사해 사용하면
#       키 파일이 없는 Windows/새 서버에서는 KEY_SOURCE 오류가 발생하는 것이 정상이다.
#       운영에서는 자신의 OS 경로·키ID·실제 키 파일로 바꾼 뒤 doctor를 실행한다.
#       내장 사용자 지정 키 하나로만 운영한다면 외부 Properties 자체가 필요 없다.
# ---- 예 1: 파일 키(설정 예시; 실제 경로·키ID로 변경) ----
crypto.key.source=file
crypto.key.id=prod01
crypto.key.file=/etc/java-crypto-kit/prod01.key

# ---- 예 2: 환경변수 키(예 1 대신 사용) ----
#crypto.key.source=env
#crypto.key.id=prod01
#crypto.key.env=CRYPTO_KEY

# ---- 예 3: HashiCorp Vault KV v2(help vault) ----
#crypto.key.source=vault
#crypto.key.id=prod02
#crypto.vault.url=https://vault.example.internal:8200
#crypto.vault.mount=secret
#crypto.vault.path=java-crypto-kit/prod
#crypto.vault.field=key
#crypto.vault.ver=1
#crypto.vault.token.file=/run/secrets/vault-token
#crypto.vault.ca.file=/etc/java-crypto-kit/vault-ca.pem

# ---- 예 4: AWS KMS Envelope Encryption(help aws-kms, 선택 설치 SDK 묶음 필요) ----
#crypto.key.source=aws-kms
#crypto.key.id=prod01
#crypto.aws.region=ap-northeast-2
#crypto.aws.kms.key.id=alias/java-crypto-kit-prod
#crypto.aws.kms.data-key.file=/etc/java-crypto-kit/prod.datakey

# ---- 공통 동작(필요한 것만) ----
# 메시지 언어: ko(기본), en, auto(JVM Locale)
#crypto.lang=ko
# 안내 WARNING 표시(false는 안내만 끄며 오류·검증에는 영향 없음)
#crypto.warning.enabled=true
# Tomcat JDBC Pool을 쓸 때(기본은 DBCP2)
#crypto.pool.factory=org.apache.tomcat.jdbc.pool.DataSourceFactory
# 개별 -Dcrypto.* 덮어쓰기를 막으려면 false(정책 자체는 -D로 바꿀 수 없음)
#crypto.jvm.override.enabled=true
