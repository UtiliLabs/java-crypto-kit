
# java-crypto-kit CI
# - main Push: 소스·빌드·CI 관련 파일이 변경된 경우에만 전체 빌드·테스트 실행.
# - README·AGENTS·docs만 변경한 Push·PR은 전체 빌드를 생략하고 docs.yml(문서 정합성 시험만, 한 작업)이 실행된다.
# - Pull Request: 소스·빌드·CI 관련 파일이 변경된 경우에만 전체 빌드·테스트 실행.
# - workflow_dispatch: GitHub Actions 화면에서 필요한 때 수동 빌드·테스트 가능.
# - Release/Pre-release는 자동 게시하지 않는다. 검증된 dist 산출물을 확인하고 GitHub Releases에서 수동 게시한다.
# - Linux JDK 8/17/21, Windows JDK 8/21 검증.
# - Git에 비밀값·사용자 지정 키·빌드 산출물 혼입을 검사한다.
# - 외부 Action은 공식 Action을 커밋 SHA로 고정한다.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, java: '8', publish: true }
          - { os: ubuntu-latest, java: '17', publish: false }
          - { os: ubuntu-latest, java: '21', publish: false }
          - { os: windows-latest, java: '8', publish: false }
          - { os: windows-latest, java: '21', publish: false }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Check gradlew (LF, executable)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if grep -q $'\r' gradlew; then
            echo "::error file=gradlew::gradlew에 CRLF 줄바꿈이 있습니다."; exit 1
          fi
          if [ ! -x gradlew ]; then
            echo "::error file=gradlew::gradlew에 실행 권한이 없습니다."; exit 1
          fi

      - name: Repository hygiene and integration script check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bad=$(git ls-files | grep -Ei '\.(jar|key|secret|token|datakey|p12|pfx|jks|keystore|pem)$|\.jar\.bak-|(^|/)\.env$' | grep -vx 'gradle/wrapper/gradle-wrapper.jar' || true)
          if [ -n "$bad" ]; then echo "::error::Git에 추적되면 안 되는 파일: $bad"; exit 1; fi
          bash -n src/test/integration/run-tomcat-integration.sh
          bash src/test/integration/run-tomcat-integration.sh --help | grep -q 'run-tomcat-integration.sh'
          set +e; bash src/test/integration/run-tomcat-integration.sh --jar does-not-exist.jar > /dev/null 2>&1; rc=$?; set -e
          [ "$rc" = 2 ] || { echo "::error::통합 시험 스크립트 환경 오류 종료 코드가 2가 아님($rc)"; exit 1; }

      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean build

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean build

      - name: Verify Java 8 class file version (major 52)
        shell: bash
        run: |
          JAR=$(ls build/libs/java-crypto-kit-*.jar)
          for c in io.javacryptokit.cli.CryptoCli io.javacryptokit.jdbc.tomcat.EncryptedDataSourceFactory \
                   io.javacryptokit.config.CryptoSettings io.javacryptokit.CredentialCrypto io.javacryptokit.file.FileCipher \
                   io.javacryptokit.security.HybridEncryption io.javacryptokit.jwt.JwtVerifier io.javacryptokit.oauth.ClientCredentials; do
            javap -v -cp "$JAR" "$c" | grep -q "major version: 52" || { echo "::error::Java 8 규격이 아님: $c"; exit 1; }
          done

      - name: CLI smoke test and public JAR safety check
        shell: bash
        run: |
          set -e
          JAR=$(ls build/libs/java-crypto-kit-*.jar)
          mkdir -p ci-tmp

          # 빌드 JAR은 CLI 관리자 비밀번호 미설정: 도움말은 설정 안내만, 다른 명령은 아무것도 하지 않고 실패(비대화형)
          java -jar "$JAR" help --lang en | grep -q "the admin password must be set first"
          if java -jar "$JAR" doctor > /dev/null 2>&1; then echo "::error::미설정 JAR에서 doctor 실행됨"; exit 1; fi
          java -jar "$JAR" doctor 2>&1 | grep -q "ADMIN_SETUP" || { echo "::error::미설정 오류 코드 아님"; exit 1; }
          # CI 관리자 비밀번호: 실행할 때마다 임의 값의 권한 600 임시 파일(값을 명령 줄·로그·Git·산출물에 남기지 않음)
          (umask 077 && printf 'Ci-%s@1\n' "$(od -An -tx1 -N12 /dev/urandom | tr -d ' \n')" > ci-tmp/admin.pw)
          java -jar "$JAR" admin setup --operator ci --admin-pass-file ci-tmp/admin.pw --out ci-tmp/base.jar > /dev/null
          ADM="--admin-pass-file ci-tmp/admin.pw"
          BASE=ci-tmp/base.jar
          if unzip -p "$BASE" META-INF/java-crypto-kit/admin.properties | grep -qF "$(cat ci-tmp/admin.pw)"; then echo "::error::관리자 비밀번호 원문이 JAR에 있음"; exit 1; fi
          unzip -p "$BASE" META-INF/java-crypto-kit/admin.properties | grep -q '^kdf=PBKDF2WithHmacSHA256$' || { echo "::error::관리자 검증값 형식 아님"; exit 1; }

          java -jar "$BASE" help > /dev/null
          java -jar "$BASE" help --lang en | grep -q "Usage"
          java -jar "$BASE" config help --lang en | grep -q "crypto.lang"
          java -jar "$BASE" doctor --lang en

          # 공개 예제 키(pass-default, default)만 포함됐는지 확인(설정 조회는 관리자 인증 필요, 인증 없으면 실패)
          java -jar "$BASE" config history --all --lang en $ADM | grep -q "admin setup  \[admin\]"
          java -jar "$BASE" config show --lang en $ADM | grep -q "pass-default: pass, embedded, public default key"
          java -jar "$BASE" config show --lang en $ADM | grep -q "Default keys : pass=pass-default, key=default"
          if java -jar "$BASE" config show > /dev/null 2>&1; then echo "::error::인증 없이 config show 성공"; exit 1; fi

          # 테스트·웹·외부 라이브러리의 기본 JAR 혼입 방지
          if unzip -l "$JAR" | grep -qiE '\.(jsp|war)$|WEB-INF/|org/junit|software/amazon|Test\.class$'; then
            echo "::error::기본 JAR에 불필요한 파일 포함"; exit 1
          fi
          if unzip -l "$JAR" | grep -q 'META-INF/java-crypto-kit/admin.properties'; then echo "::error::배포 JAR에 관리자 검증값 포함"; exit 1; fi

          # 사용자 지정 키 내장과 변경 이력 검증(키 생성·변경에는 관리자 인증과 사유 필수, AES 키 이력은 --type key로 조회)
          java -jar "$BASE" keygen --out ci-tmp/ci.key --reason "CI smoke" $ADM
          java -jar "$BASE" config embed-key --from-file ci-tmp/ci.key --key-id ci01 --operator ci --reason "CI smoke" --yes --out ci-tmp/company.jar $ADM
          java -jar ci-tmp/company.jar config history --type key --lang en $ADM | grep -q "crypto.key.id: default -> ci01"
          java -jar ci-tmp/company.jar config show --lang en $ADM | grep -q "crypto.key.id = ci01"
          # JAR 안 내장 키·이력은 obf1(경량 난독화)로 저장: 키 파일 원문·이력 본문이 글자 그대로 보이면 안 됨
          unzip -p ci-tmp/company.jar java-crypto-kit.properties | grep -q '^crypto.key.embedded=obf1:' || { echo "::error::내장 키가 obf1이 아님"; exit 1; }
          if unzip -p ci-tmp/company.jar java-crypto-kit.properties | grep -qF "$(cat ci-tmp/ci.key)"; then echo "::error::키 원문이 JAR에 있음"; exit 1; fi
          unzip -p ci-tmp/company.jar META-INF/java-crypto-kit/config-history.properties | head -c 5 | grep -qx 'obf1:' || { echo "::error::이력이 obf1이 아님"; exit 1; }
          if unzip -p ci-tmp/company.jar META-INF/java-crypto-kit/config-history.properties | grep -q 'ci01'; then echo "::error::이력 본문이 평문"; exit 1; fi

          # 키 지문 일치 확인(fingerprint는 관리자 비밀번호 없이 64자 전체 지문을 출력)
          fp_jar=$(java -jar ci-tmp/company.jar fingerprint --type key | grep -oE '[0-9a-f]{64}')
          fp_key=$(java -jar "$BASE" fingerprint --key-file ci-tmp/ci.key | grep -oE '[0-9a-f]{64}')
          [ -n "$fp_jar" ] && [ "$fp_jar" = "$fp_key" ] || { echo "::error::키 지문 불일치"; exit 1; }
          java -jar ci-tmp/company.jar doctor > /dev/null
          # 관리자 인증 뒤 원문 내보내기(key 파일 형식 = keygen 키 파일)
          java -jar ci-tmp/company.jar config key show --key-id ci01 --export ci-tmp/ci01.export $ADM > /dev/null
          cmp ci-tmp/ci.key ci-tmp/ci01.export || { echo "::error::내보낸 키가 원래 키 파일과 다름"; exit 1; }

          # pass 키 추가(비대화형 생성은 --export 필수, 내보낸 파일 = 복원 백업)·기본 키 지정과 키 목록 확인
          java -jar "$BASE" config key add --key-id ci-pass --generate --export ci-tmp/ci.pass --active --operator ci --reason "CI smoke" --yes --out ci-tmp/pass.jar $ADM > /dev/null
          java -jar ci-tmp/pass.jar config show --lang en $ADM | grep -q "Default keys : pass=ci-pass, key=default"
          java -jar ci-tmp/pass.jar fingerprint --lang en | grep -q "Key ID     : ci-pass"
          java -jar ci-tmp/pass.jar doctor > /dev/null
          head -1 ci-tmp/ci.pass | grep -qx '# java-crypto-kit pass-key-backup v1' || { echo "::error::pass 복원 백업 형식 아님"; exit 1; }
          ci_pass=$(sed -n 's/^passphrase=//p' ci-tmp/ci.pass)
          [ "${#ci_pass}" = 32 ] || { echo "::error::백업의 Passphrase 길이 이상"; exit 1; }
          if unzip -p ci-tmp/pass.jar java-crypto-kit.properties | grep -qF "$ci_pass"; then echo "::error::Passphrase 원본이 JAR에 있음"; exit 1; fi
          # 복원 백업으로 원본 JAR 없이 같은 키 복원(같은 64자 지문)
          java -jar "$BASE" config key add --key-id ci-pass --from-file ci-tmp/ci.pass --operator ci --reason "CI restore" --yes --out ci-tmp/restored.jar $ADM > /dev/null
          fp_a=$(java -jar ci-tmp/pass.jar fingerprint --key-id ci-pass | grep -oE '[0-9a-f]{64}')
          fp_b=$(java -jar ci-tmp/restored.jar fingerprint --key-id ci-pass | grep -oE '[0-9a-f]{64}')
          [ -n "$fp_a" ] && [ "$fp_a" = "$fp_b" ] || { echo "::error::복원 키 지문 불일치"; exit 1; }
          # 사유 없는 키 생성, 관리자 인증 없는 키 생성은 비대화형에서 아무것도 만들기 전에 실패
          if java -jar "$BASE" keygen --out ci-tmp/no-reason.key $ADM 2>/dev/null; then echo "::error::사유 없는 keygen 성공"; exit 1; fi
          test ! -e ci-tmp/no-reason.key
          if java -jar "$BASE" keygen --out ci-tmp/no-auth.key --reason "CI smoke" 2>/dev/null; then echo "::error::인증 없는 keygen 성공"; exit 1; fi
          test ! -e ci-tmp/no-auth.key

          # 연속 설정 변경 시 JAR 이름 검증
          java -jar ci-tmp/company.jar config set crypto.lang=en --operator ci $ADM > /dev/null
          java -jar ci-tmp/company-configured.jar config set crypto.warning.enabled=false --operator ci $ADM > /dev/null
          test -f ci-tmp/company-configured-2.jar
          if ls ci-tmp | grep -q 'configured-.*configured'; then echo "::error::JAR 이름 접미사 누적"; exit 1; fi
          java -jar ci-tmp/company-configured-2.jar config history --all --lang en $ADM | grep -q "crypto.warning.enabled: true -> false"

          # 파일 암복호화 왕복(복호화만 관리자 인증)
          printf 'hello\n한글 파일\n' > "ci-tmp/in put.txt"
          java -jar ci-tmp/company.jar file encrypt --in "ci-tmp/in put.txt"
          java -jar ci-tmp/company.jar file decrypt --in "ci-tmp/in put.txt.jck" --out ci-tmp/out.txt $ADM
          cmp "ci-tmp/in put.txt" ci-tmp/out.txt

          # 빈 파일과 32MiB 파일 검증
          : > ci-tmp/empty.txt
          java -jar ci-tmp/company.jar file encrypt --in ci-tmp/empty.txt
          java -jar ci-tmp/company.jar file decrypt --in ci-tmp/empty.txt.jck --out ci-tmp/empty.out $ADM
          cmp ci-tmp/empty.txt ci-tmp/empty.out
          head -c 33554432 /dev/urandom > ci-tmp/big.bin
          java -jar ci-tmp/company.jar file encrypt --in ci-tmp/big.bin
          java -jar ci-tmp/company.jar file decrypt --in ci-tmp/big.bin.jck --out ci-tmp/big.out $ADM
          cmp ci-tmp/big.bin ci-tmp/big.out
          rm -rf ci-tmp

      - name: Check the optional AWS KMS bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ZIP=$(ls build/distributions/java-crypto-kit-aws-kms-lib-*.zip)
          unzip -l "$ZIP" | grep -q 'aws-kms-lib/kms-' || { echo "::error::KMS SDK JAR 없음"; exit 1; }
          if unzip -l "$ZIP" | grep -q 'java-crypto-kit-[0-9]'; then echo "::error::기본 JAR 혼입"; exit 1; fi
          if unzip -l "$ZIP" | grep -qE 'apache-client|apache5-client|httpclient5|httpcore5|httpclient-4|httpcore-4|netty'; then echo "::error::불필요한 HTTP 클라이언트 포함"; exit 1; fi
          [ "$(unzip -l "$ZIP" | grep -c 'aws-kms-lib/url-connection-client-')" = 1 ] || { echo "::error::url-connection-client 없음"; exit 1; }

      # 산출물 생성은 배포가 아님. 실제 Release는 수동 게시.
      - name: Prepare distribution files for manual release (SHA-256)
        if: matrix.publish
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/java-crypto-kit-*.jar build/distributions/java-crypto-kit-aws-kms-lib-*.zip dist/
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifacts (not a Release)
        if: matrix.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: build/reports/
          retention-days: 7
